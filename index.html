<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funboarding · onboarding prototype</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --ink: #161616; --muted: #6b6b6b; --line: #e3e3df;
    --primary: #111111; --primary-ink: #ffffff;
    --teal: #0f8f80; --teal-tint: #e6f5f2;
    --admin: #eaf2fd; --admin-line: #c9dcf6;
    --low: #2e8b3e; --low-tint: #e4f3e6;
    --medium: #b88a00; --medium-tint: #fbf3d6;
    --high: #d0661b; --high-tint: #fbe8da;
    --declined: #c62f2f; --declined-tint: #f9e1e1;
    --page: linear-gradient(180deg, #ffffff 0%, #f5f2fb 100%);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141414; --card: #1e1e1e; --ink: #ededed; --muted: #a3a3a3; --line: #333;
      --primary: #f2f2f2; --primary-ink: #111;
      --teal: #3cc2b0; --teal-tint: #12302c;
      --admin: #16233a; --admin-line: #2b4269;
      --low: #5cc56b; --low-tint: #183420; --medium: #e0b93a; --medium-tint: #3a3112;
      --high: #f0904a; --high-tint: #3d2615; --declined: #f06c6c; --declined-tint: #3d1b1b;
      --page: #141414;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141414; --card: #1e1e1e; --ink: #ededed; --muted: #a3a3a3; --line: #333;
    --primary: #f2f2f2; --primary-ink: #111;
    --teal: #3cc2b0; --teal-tint: #12302c;
    --admin: #16233a; --admin-line: #2b4269;
    --low: #5cc56b; --low-tint: #183420; --medium: #e0b93a; --medium-tint: #3a3112;
    --high: #f0904a; --high-tint: #3d2615; --declined: #f06c6c; --declined-tint: #3d1b1b;
    --page: #141414;
  }
  .ghost.theme { width: 34px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .ghost.theme svg { width: 18px; height: 18px; display: block; }
  .modebar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; padding: 8px 10px; border-radius: 10px; background: var(--teal-tint); width: fit-content; }
  .modebar .seglabel { color: var(--teal); }
  #btn-map { margin-left: auto; }
  footer { display: flex; justify-content: center; align-items: center; gap: 8px; padding: 28px 16px 36px; color: var(--muted); font-size: 14px; }
  footer b { color: var(--ink); }
  .draftcard { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 12px 0; background: var(--bg); }
  .opt-row { opacity: .75; border-top: 1px dashed var(--line); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(66, 133, 244, .55); } 70% { box-shadow: 0 0 0 10px rgba(66, 133, 244, 0); } 100% { box-shadow: 0 0 0 0 rgba(66, 133, 244, 0); } }
  .ghost.pulse { background: var(--admin); border-color: var(--admin-line); animation: pulse 1.6s ease-out infinite; }
  .ghost.pulse::after { content: ' \00b7 see the score'; font-size: 11px; color: var(--muted); }
  .pair { display: flex; gap: 10px; flex-wrap: wrap; }
  footer .ar { font-size: 16px; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--page); background-attachment: fixed; color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  button { font: inherit; cursor: pointer; }

  /* Top bar */
  .topbar { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
  .brand { font-weight: 700; margin-right: 8px; display: flex; align-items: center; gap: 8px; }
  .logo { width: 24px; height: 24px; color: var(--primary); }
  .brand .ar { font-weight: 500; color: var(--muted); font-size: 16px; }
  .brand .sub { font-weight: 400; color: var(--muted); font-size: 12px; }
  @media (max-width: 768px) { .brand .sub { display: none; } }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 2px; background: var(--bg); }
  .seg button { border: 0; background: transparent; color: var(--muted); padding: 5px 12px; border-radius: 999px; font-size: 13px; }
  .seg button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.12); font-weight: 600; }
  .seglabel { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-right: 6px; }
  .ctl { display: flex; align-items: center; }
  .ghost { border: 1px solid var(--line); background: var(--card); color: var(--ink); padding: 6px 12px; border-radius: 8px; font-size: 13px; }
  .ghost.on { background: var(--admin); border-color: var(--admin-line); font-weight: 600; }

  /* Progress */
  .progress { padding: 12px 16px 0; max-width: 1200px; margin: 0 auto; }
  .bar { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--primary); transition: width .3s; }
  .steps { display: flex; justify-content: space-between; margin-top: 6px; font-size: 11px; color: var(--muted); gap: 4px; }
  .steps span.cur { color: var(--ink); font-weight: 600; }
  .steps span.vend { color: var(--teal); }
  .steps span { cursor: pointer; border-radius: 4px; padding: 1px 2px; }
  .steps span:hover { text-decoration: underline; }

  /* Layout */
  .layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 16px; padding: 16px; align-items: flex-start; }
  .user { flex: 1 1 60%; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 22px; position: relative; }
  .card.vendor { border: 2px solid var(--teal); padding: 21px; }
  .pill { position: absolute; top: 14px; right: 14px; font-size: 11px; font-weight: 600; color: var(--teal); background: var(--teal-tint); border-radius: 999px; padding: 3px 10px; }
  .eyebrow { font-size: 12px; color: var(--muted); }
  h1 { font-size: 22px; margin: 2px 0 6px; line-height: 1.25; padding-right: 150px; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  p { margin: 6px 0; }
  .muted { color: var(--muted); }
  .tag { display: inline-block; border: 1px dashed var(--muted); color: var(--muted); border-radius: 6px; font-size: 11px; padding: 1px 7px; margin-left: 6px; vertical-align: middle; font-weight: 500; }
  .field { border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--bg); margin: 6px 0; }
  .field b { display: block; font-size: 11px; color: var(--muted); font-weight: 500; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
  .opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 12px; padding: 12px; }
  .opt small { display: block; color: var(--muted); font-size: 12px; }
  .opt .dot { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--muted); flex: none; margin-top: 3px; }
  .opt.on { border: 2px solid var(--primary); padding: 11px; }
  .opt.on .dot { border: 5px solid var(--primary); }
  @media (max-width: 768px) { .opts { grid-template-columns: 1fr; } }
  .fld { display: block; margin: 6px 0; }
  .fld > span { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .fld small { display: block; font-size: 11px; color: var(--muted); margin-top: 3px; }
  input, select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
  .people { border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
  .prow { display: grid; grid-template-columns: 1.4fr 1.2fr 0.9fr auto; gap: 8px; align-items: center; margin-bottom: 8px; }
  .own { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); white-space: nowrap; }
  .own input { width: 70px; }
  .rm { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 8px; width: 34px; height: 34px; }
  .add { font-size: 13px; padding: 7px 12px; }
  .warnline { color: var(--declined); font-size: 13px; margin: 8px 0 0; }
  .admin .band { font-size: 11px; }
  @media (max-width: 768px) { .prow { grid-template-columns: 1fr 1fr; } }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .nav { display: flex; justify-content: space-between; align-items: center; margin-top: 22px; gap: 10px; flex-wrap: wrap; }
  .btn { background: var(--primary); color: var(--primary-ink); border: 0; padding: 10px 20px; border-radius: 999px; font-weight: 600; }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .btn2 { background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 10px 18px; border-radius: 999px; }
  .btn2.sm { padding: 5px 12px; font-size: 13px; flex: none; align-self: center; }
  .rm.trash { display: inline-grid; place-items: center; flex: none; align-self: center; }
  .rm.trash:hover { color: var(--declined); }
  .lock { font-size: 12px; color: var(--muted); margin: 14px 0 0; }
  .stmt { border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin: 16px 0 6px; background: var(--bg); }
  .stmt h2 { margin: 0 0 4px; }
  .stmt .file { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  .stmt .file svg { width: 26px; height: 26px; flex: none; color: var(--muted); }
  .stmt .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 18px; margin-top: 10px; text-align: center; background: var(--card); }
  .notice { border-radius: 10px; padding: 12px 14px; margin: 12px 0; background: var(--bg); border: 1px solid var(--line); }
  .demo { border: 1px dashed var(--muted); border-radius: 10px; padding: 10px 12px; margin: 14px 0; font-size: 13px; }
  .demo .seg { display: flex; width: fit-content; margin-top: 8px; flex-wrap: wrap; }
  .cover { height: 150px; border-radius: 10px; background: linear-gradient(135deg, #c9d6c4, #e9dcc3); display: flex; align-items: flex-end; padding: 12px; color: #2b2b2b; font-weight: 600; margin: 10px 0; }
  .check { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .check:last-child { border-bottom: 0; }
  .tick { width: 20px; height: 20px; border-radius: 50%; background: var(--low); color: #fff; font-size: 12px; display: grid; place-items: center; flex: none; margin-top: 2px; }
  .tick.wait { background: var(--line); color: var(--muted); }
  .tick.warn { background: var(--medium); }
  .vendorbox { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-top: 10px; }
  .vendorbox .vhead { background: var(--bg); padding: 8px 12px; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); }
  .vendorbox .vbody { padding: 4px 12px; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 16px 0; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .band { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
  .band.low { color: var(--low); background: var(--low-tint); }
  .band.medium { color: var(--medium); background: var(--medium-tint); }
  .band.high { color: var(--high); background: var(--high-tint); }
  .band.declined { color: var(--declined); background: var(--declined-tint); }
  .mail { border: 1px solid var(--line); border-radius: 10px; margin-top: 10px; }
  .mail .mh { padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .mail .mb { padding: 12px; }
  .toast { border-left: 3px solid var(--primary); }
  .live { display: inline-block; background: var(--low-tint); color: var(--low); font-weight: 700; font-size: 12px; padding: 2px 10px; border-radius: 999px; }
  .meter { height: 8px; border-radius: 8px; background: var(--line); margin: 10px 0 4px; }

  /* Admin drawer */
  .admin { flex: 0 0 40%; background: var(--admin); border: 1px solid var(--admin-line); border-radius: 14px; padding: 18px; position: sticky; top: 120px; max-height: calc(100vh - 140px); overflow: auto; animation: slidein .25s ease-out; }
  @keyframes slidein { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  .admin .ahead { display: flex; justify-content: space-between; align-items: center; }
  .admin .albl { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .admin h3 { margin: 6px 0 10px; font-size: 16px; }
  .admin table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--card); border-radius: 10px; overflow: hidden; }
  .admin td, .admin th { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .admin th { font-size: 11px; color: var(--muted); font-weight: 600; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
  .actions span { border: 1px solid var(--admin-line); background: var(--card); border-radius: 8px; padding: 5px 10px; font-size: 12px; }
  .actions span.main { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); }
  .log { font-size: 13px; background: var(--card); border-radius: 10px; padding: 6px 12px; }
  .log div { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .log div:last-child { border-bottom: 0; }
  .x { border: 0; background: transparent; font-size: 20px; color: var(--muted); }

  /* Path map */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; display: flex; justify-content: center; align-items: flex-start; overflow: auto; padding: 24px 12px; }
  .map { background: var(--card); border-radius: 14px; padding: 20px; max-width: 980px; width: 100%; }
  .stage { display: flex; gap: 12px; align-items: stretch; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .stage:last-child { border-bottom: 0; }
  .sname { flex: 0 0 120px; font-size: 12px; color: var(--muted); padding-top: 8px; }
  .nodes { display: flex; flex-wrap: wrap; gap: 8px; }
  .node { border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 7px 11px; font-size: 13px; text-align: left; }
  .node small { display: block; color: var(--muted); font-size: 11px; }
  .node.v { border: 2px solid var(--teal); }
  .node.cur { outline: 3px solid var(--primary); outline-offset: 1px; }
  .node.faded { opacity: .35; border-style: dashed; }
  .node.end { border-style: dashed; }
  .node.b-low { background: var(--low-tint); } .node.b-medium { background: var(--medium-tint); }
  .node.b-high { background: var(--high-tint); } .node.b-declined { background: var(--declined-tint); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); margin: 6px 0 12px; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid var(--line); }

  @media (max-width: 768px) {
    .layout { display: block; padding: 12px 16px; }
    .admin { position: fixed; inset: 0; top: 0; max-height: none; border-radius: 0; z-index: 30; }
    .grid { grid-template-columns: 1fr; }
    h1 { padding-right: 0; margin-top: 28px; }
    .sname { flex-basis: 80px; }
    .steps span { display: none; } .steps span.cur { display: inline; }
  }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">Onboarding prototype</div>
  <div class="ctl"><span class="seglabel">Applicant</span><div class="seg" id="seg-app"></div></div>
  <button class="ghost" id="btn-map">🗺️ Path map</button>
  <button class="ghost" id="btn-admin">🛡️ Admin view</button>
  <button class="ghost theme" id="btn-theme" aria-label="Switch light or dark mode"></button>
</div>
<div class="progress"><div class="bar"><div id="bar"></div></div><div class="steps" id="steps"></div></div>
<div class="layout">
  <div class="user" id="user"></div>
  <div class="admin" id="admin" hidden></div>
</div>
<footer><b>Funboarding</b></footer>
<div class="overlay" id="overlay" hidden></div>

<script>
const S = { step: 0, app: 'org', mode: 'inhouse', outcome: 'low', registry: true, vendorResult: 'pass', draft: false, approved: false, checking: false, admin: false, map: false, removed: {}, draftStep: 2, payout: 'manual', linked: false, paySaved: false };
const STEPS = ['Sign up', 'Person or organization', 'Campaign', 'Risk form', 'Checking your details', 'Verification', 'Review', 'What you hear', 'Go live', 'Payout account'];
const VENDOR_STEPS = [5, 6, 7, 9];
// Test values only (standard test routing and account numbers)
S.pay = { country: 'US', bank: 'Community Bank', type: 'Checking', routing: '110000000', acct: '000123456789', acct2: '000123456789' };
const ORG = 'Hope Valley Community Center';
const PERSON = 'Amina Rahman';
const BAND = { low: 'Low risk', medium: 'Medium risk', high: 'High risk', declined: 'Declined' };
const $ = id => document.getElementById(id);
const isOrg = () => S.app === 'org';
const vendor = () => S.mode === 'vendor';
const name = () => isOrg() ? ORG : PERSON + ' (personal)';
const field = (k, v) => `<div class="field"><b>${k}</b>${v}</div>`;
const tick = (cls, t) => `<span class="tick ${cls || ''}">${t || '&#10003;'}</span>`;
const row = (cls, title, sub, t) => `<div class="check">${tick(cls, t)}<div><b>${title}</b>${sub ? `<div class="muted">${sub}</div>` : ''}</div></div>`;
function seg(id, opts, key) {
  $(id).innerHTML = opts.map(([v, l]) => `<button class="${S[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}">${l}</button>`).join('');
}
function demoSeg(key, opts) {
  return `<div class="seg">${opts.map(([v, l]) => `<button class="${S[key] === v ? 'on' : ''}" data-k="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
}
const reviewer = () => S.outcome === 'high' ? 'Compliance team' : 'Reviewer';
const flagged = () => S.outcome === 'medium' || S.outcome === 'high';
const vendorLow = () => vendor() && S.vendorResult === 'low';
// Manual document review: Low goes live on submit while it runs; everyone else waits as a draft
const liveDuring = () => S.outcome === 'low' && (!vendor() || regDocs());
const waits = () => !liveDuring() && (!vendor() || regDocs() || vendorLow());
// Vendor verified the person, but the organization fell back to uploaded documents
const regDocs = () => vendor() && isOrg() && !S.registry && !vendorLow();

function choice() {
  const opt = (v, t, d) => `<button class="opt ${S.app === v ? 'on' : ''}" data-k="app" data-v="${v}"><span class="dot"></span><span><b>${t}</b><small>${d}</small></span></button>`;
  return `<div class="opts">${opt('org', 'An organization', 'A charity, mosque, school or group')}${opt('person', 'Myself', 'Fundraise from your personal account')}</div>`;
}

/* ---------- Risk form (step 4) ---------- */
S.form = {
  dob: '1988-03-14', nat: 'A', birth: 'A', res: 'A', email: 'amina.rahman@example.org', phone: '+1 555 0134',
  inc: 'A', ops: 'A', entity: 'standalone', activity: 'registered', year: '2016', reg: '12-3456789', website: 'hopevalley.example.org',
  people: [{ name: 'Amina Rahman', role: 'Director', own: '0' }, { name: 'Yusuf Khan', role: 'Authorized signatory', own: '0' }]
};
const COUNTRIES = [['A', 'Country A (low risk)'], ['B', 'Country B (medium risk)'], ['C', 'Country C (high risk)']];
const CRISK = { A: 'Low', B: 'Medium', C: 'High' };
const ENTITIES = [['standalone', 'Standalone charity or nonprofit', 'Low'], ['parent', 'Parent of other organizations', 'Medium'], ['subsidiary', 'Subsidiary of another organization', 'Medium'], ['trust', 'Trust', 'High'], ['foundation', 'Foundation', 'High'], ['nominee', 'Held through a nominee', 'High']];
const ACTIVITIES = [['registered', 'Registered charity', 'Low'], ['new', 'Newly registered charity', 'Medium'], ['forprofit', 'For-profit business', 'High']];
const ROLES = ['Director', 'Officer', 'Authorized signatory', 'Owner (no management role)'];
const sel = (f, opts, val) => `<select data-f="${f}">${opts.map(([v, l]) => `<option value="${v}" ${val === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
const inp = (f, val, type) => `<input data-f="${f}" type="${type || 'text'}" value="${val}">`;
const lbl = (k, ctl, hint) => `<label class="fld"><span>${k}</span>${ctl}${hint ? `<small>${hint}</small>` : ''}</label>`;

function ratings() {
  const F = S.form;
  if (!isOrg()) return [
    ['Date of birth', F.dob ? 'Low' : 'High', F.dob ? '' : 'Missing data scores as the highest risk'],
    ['Address and country', CRISK[F.res], ''],
    ['Nationality and country of birth', CRISK[F.nat] === 'High' || CRISK[F.birth] === 'High' ? 'High' : (CRISK[F.nat] === 'Medium' || CRISK[F.birth] === 'Medium' ? 'Medium' : 'Low'), ''],
    ['Email and phone', F.email && F.phone ? 'Low' : 'High', ''],
    ['Digital footprint', '-', 'Read in the background, not from the form']];
  const managers = F.people.filter(p => !p.role.startsWith('Owner')).length;
  const owners = F.people.filter(p => +p.own >= 25);
  const ent = ENTITIES.find(e => e[0] === F.entity);
  const act = ACTIVITIES.find(a => a[0] === F.activity);
  return [
    ['Jurisdiction', F.ops !== F.inc ? 'High' : CRISK[F.inc], F.ops !== F.inc ? 'Operates outside its country of incorporation' : ''],
    ['Legal form', ent[2], ent[1]],
    ['Business activity', act[2], act[1] + (F.activity === 'new' ? `, formed ${F.year}` : '')],
    ['Directors and signatories', managers <= 2 ? 'Low' : managers <= 6 ? 'Medium' : 'High', `${managers} ${managers === 1 ? 'person' : 'people'}`],
    ['Owners of 25% or more', '-', `${owners.length} listed. Not scored yet (to confirm)`],
    ['Online presence', F.website ? 'Low' : 'High', F.website ? 'Domain age checked in the background' : 'No website or social links']];
}
function computedBand() {
  const r = ratings().map(x => x[1]);
  const highs = r.filter(x => x === 'High').length, meds = r.filter(x => x === 'Medium').length;
  return highs >= 3 ? 'declined' : highs >= 1 ? 'high' : meds >= 1 ? 'medium' : 'low';
}
function peopleTable() {

      <span class="own"><input data-pi="${k}" data-pf="own" type="number" min="0" max="100" value="${p.own}"><span>% owned</span></span>
      <button class="rm" data-act="rmperson" data-i="${k}" aria-label="Remove">&times;</button></div>`).join('')}
    <button class="btn2 add" data-act="addperson">+ Add a person</button>
    ${total > 100 ? `<p class="warnline">Ownership adds up to ${total}%. It can't be more than 100%.</p>` : ''}</div>`;
}
function riskForm() {
  const F = S.form;
  return `<p class="muted">We use these answers to check your application in seconds. No documents or IDs yet. Try changing them, and open Admin view to see the effect.</p>
  <h2>About you</h2>

  ${isOrg() ? `<h2>About your organization</h2>
  <div class="grid">${lbl('Country of incorporation', sel('inc', COUNTRIES, F.inc))}${lbl('Main country of operation', sel('ops', COUNTRIES, F.ops))}

  ${lbl('Business activity', sel('activity', ACTIVITIES.map(a => [a[0], a[1]]), F.activity))}
  ${F.activity === 'new' ? lbl('Year formed', inp('year', F.year, 'number')) : ''}

function riskPreview() {

  return `<h3>Live score preview</h3><p class="muted">Not visible to the user. Drafts aren't in any queue; this shows how the current answers would score.</p>

  <table><tr><th>Factor</th><th>Rating</th><th>Why</th></tr>${ratings().map(([f, r, n]) => `<tr><td>${f}</td><td>${r === '-' ? '<span class="muted">Not scored</span>' : `<span class="band ${r.toLowerCase()}">${r}</span>`}</td><td class="muted">${n || ''}</td></tr>`).join('')}</table>
  <div class="notice" style="background:var(--card)"><b>What the user sees next:</b> ${next}</div>
  <p class="muted" style="font-size:12px">Placeholder rule, since the real formula isn't decided: any three High ratings decline, any High goes to compliance, any Medium goes to a reviewer, otherwise Low. Countries A, B and C stand in for the internal risk list. Weights aren't shown.</p>`;
}

const TRASH = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/></svg>';

/* ---------- User screens ---------- */
function userScreen(i) {
  switch (i) {
    case 0: return {
      h: 'Create your account', body: `

/* ---------- Payout account (step 10) ---------- */
const holder = () => S.pay.holder ?? (isOrg() ? ORG : PERSON);
const last4 = () => S.payout === 'vendor' ? '6789' : S.pay.acct.slice(-4);

    : `<button class="btn2" data-act="back">Back</button><button class="btn" id="paysave" data-act="paysave" ${payOk() ? '' : 'disabled'}>Save payout account</button>`;
  if (S.payout === 'vendor') return {

    ${S.linked
      ? `<div class="check">${tick()}<div style="flex:1"><b>${P.bank}, checking &bull;&bull;&bull;&bull;6789</b><div class="muted">Account holder: ${who}. Name matches.</div></div>${S.paySaved ? '' : `<button class="rm trash" data-act="unlink" aria-label="Remove bank account">${TRASH}</button>`}</div>`
      : row('wait', 'Choose your bank', '', '1') + row('wait', 'Log in through the vendor', 'We never see your bank username or password.', '2') + row('wait', 'Pick the account for payouts', 'Account ownership is checked automatically.', '3')
        + `<div style="padding:10px 0"><button class="btn" data-act="link">Connect your bank</button></div>`}
    </div></div>
    <p class="muted" style="margin-top:10px">Can't find your bank? Switch to <b>Enter manually</b> above.</p>
    ${S.paySaved ? done : ''}${lock}` };
  const mismatch = P.acct2 && P.acct !== P.acct2;
  return {
    h: 'Add a payout account', nav, body: `
    <p class="muted">Enter the bank account where donations are paid out. Already filled in with test values.</p>
    <div class="grid">${pin('holder', 'Account holder name', `Must match ${isOrg() ? 'the organization\'s legal name' : 'the name on your ID'}`)}
    ${psel('country', 'Bank country', [['US', 'United States']])}
    ${pin('bank', 'Bank name')}${psel('type', 'Account type', [['Checking', 'Checking'], ['Savings', 'Savings']])}
    ${pin('routing', 'Routing number', '9 digits', 'text')}<span></span>
    ${pin('acct', 'Account number')}${pin('acct2', 'Confirm account number')}</div>
    ${mismatch ? `<p class="warnline">Account numbers don't match.</p>` : ''}
    <div class="stmt"><h2>Bank statement <span class="tag">to confirm with compliance: when we capture it</span></h2>
    <div class="muted">Required for accounts added by hand. From the last 3 months, in the account holder's name, showing the account number above.</div>
    ${S.removed.stmt
      ? `<div class="drop"><div class="muted" style="margin-bottom:10px">PDF, JPG or PNG</div><button class="btn" data-act="up" data-key="stmt">Upload bank statement</button></div>`
      : `<div class="file">${FILE}<div style="flex:1"><b>bank-statement.pdf</b><div class="muted">Uploaded. Our compliance team reviews it before the first payout.</div></div>${S.paySaved ? '' : `<button class="rm trash" data-act="rmup" data-key="stmt" aria-label="Remove bank statement">${TRASH}</button>`}</div>`}</div>
    <p class="muted" style="font-size:12px">Outside the US we ask for IBAN and SWIFT/BIC instead. <span class="tag">to confirm: fields per country</span></p>
    ${S.paySaved ? done : ''}${lock}` };

/* ---------- Admin screens ---------- */
function factors() {
  const note = S.outcome !== computedBand() ? `<p class="muted" style="font-size:12px">The demo control overrides the result. The answers alone give ${BAND[computedBand()]}.</p>` : '';
  return `<table><tr><th>Factor</th><th>Rating</th></tr>${ratings().map(([f, v]) => `<tr><td>${f}</td><td>${v === '-' ? 'Not scored' : v}</td></tr>`).join('')}</table>${note}`;
}
function caseHead() {
  return `<p><b>${name()}</b><br><span class="band ${S.outcome}">${BAND[S.outcome]}</span> &nbsp;<span class="muted">Score band and review state are shown separately.</span></p>`;
}
function audit(extra) {
  const items = ['Draft created', 'Risk form submitted', `Score: ${BAND[S.outcome]}`];
  if (flagged()) items.push(`${reviewer()} approved after review`);
  items.push(vendor() ? 'Vendor verification ' + (vendorLow() ? 'low result, sent to compliance' : 'passed') : 'Documents uploaded to secure document storage');
  if (regDocs()) items.push('Company registry not reachable, organization documents uploaded');
  if (liveDuring()) items.push('Campaign live while documents are reviewed, payouts held');
  if (waits()) items.push('Saved as draft until the review approves it');
  if (!vendor() || regDocs()) items.push('Reviewer approved documents' + (liveDuring() ? ', payouts released' : ''));
  if (vendorLow()) items.push('Compliance team approved');
  items.push(...(extra || []).filter(t => !(liveDuring() && t === 'Campaign live')));
  return `<div class="log">${items.map((t, k) => `<div><span class="muted">Day 1, 10:${String(2 + k * 7).padStart(2, '0')}</span> &nbsp;${t}</div>`).join('')}</div>`;
}
function adminScreen(i) {
  if (i === 3) return riskPreview();
  if (i <= 2) return `<h3>Nothing to review</h3><p>${S.draft ? 'A draft is saved. ' : ''}Drafts are not in any queue. Compliance starts when the user submits for go-live.</p>`;
  if (i === 4) {
    const q = { low: ['Cleared automatically', 'No review needed. Sent to verification.'], medium: ['Reviewer queue', 'A reviewer checks the flagged items and can request information.'], high: ['Compliance review queue', 'Enhanced review by the compliance team.'], declined: ['Declined', 'The reason stays internal. The user sees a generic message.'] }[S.outcome];
    const acts = S.outcome === 'medium' ? ['Approve', 'Request information', 'Escalate to compliance', 'Decline']
      : S.outcome === 'high' ? ['Approve', 'Request information', 'Decline'] : [];
    return `<h3>${q[0]}</h3>${caseHead()}<p>${q[1]}</p>${acts.length ? `<div class="actions">${acts.map((a, k) => `<span class="${k === 0 ? 'main' : ''}">${a}</span>`).join('')}</div>` : ''}
      <h2>Risk form answers, rated</h2>${factors()}<p class="muted" style="font-size:12px">Weights and thresholds are not shown here.</p>`;
  }
  if (i === 5) {
    const docs = !vendor()
      ? `<table><tr><th>Document</th><th>Status</th></tr><tr><td>Photo ID</td><td>Uploaded</td></tr>${isOrg() ? '<tr><td>Registration document</td><td>Uploaded</td></tr><tr><td>Formation documents</td><td>Uploaded</td></tr><tr><td>Board resolution</td><td>Uploaded</td></tr>' : ''}</table><p class="muted" style="font-size:12px">Files sit in secure document storage. Reads are logged.</p>`
      : `<table><tr><th>Vendor check</th><th>Result</th></tr><tr><td>ID document</td><td>Passed</td></tr><tr><td>Selfie check</td><td>Passed</td></tr><tr><td>Sanctions screening</td><td>Clear</td></tr>${isOrg() ? `<tr><td>Company registry</td><td>${S.registry ? 'Found' : 'Not reachable, documents requested'}</td></tr>` : ''}</table><p class="muted" style="font-size:12px">We keep the vendor's references and results.</p>`;
    return `<h3>Case detail</h3>${caseHead()}${docs}`;
  }
  if (i === 6) {
    if (!vendor()) return `<h3>Reviewer queue</h3>${caseHead()}<p>Check the uploaded documents against the risk form. ${liveDuring() ? 'The campaign is already live, with payouts held until you approve. If you find a problem, compliance decides what happens to the live campaign.' : 'The campaign stays a draft until you approve.'}</p><div class="actions"><span class="main">Approve</span><span>Request information</span><span>Escalate to compliance</span><span>Decline</span></div>`;
    if (regDocs()) return `<h3>Reviewer queue</h3>${caseHead()}<p>The vendor verified the person but couldn't reach the company registry. Check the uploaded organization documents. ${liveDuring() ? 'The campaign is already live, with payouts held until you approve. If you find a problem, compliance decides what happens to the live campaign.' : 'The campaign stays a draft until you approve.'}</p><table><tr><th>Document</th><th>Status</th></tr><tr><td>Registration document</td><td>Uploaded</td></tr><tr><td>Formation documents</td><td>Uploaded</td></tr><tr><td>Board resolution</td><td>Uploaded</td></tr></table><div class="actions"><span class="main">Approve</span><span>Request information</span><span>Escalate to compliance</span><span>Decline</span></div>`;
    if (vendorLow()) return `<h3>Compliance review queue</h3>${caseHead()}<p>The vendor returned a low result, so the case comes back to the compliance team. The campaign stays a draft until you approve.</p><div class="actions"><span class="main">Approve</span><span>Request information</span><span>Decline</span></div>`;
    return `<h3>No action needed</h3>${caseHead()}<p>The vendor verified the ${isOrg() ? 'person and organization' : 'person'}. The case closes automatically.</p>`;
  }
  if (i === 9) {
    const v = S.payout === 'vendor', has = v ? S.linked : true;
    const rows = [['Method', v ? 'Bank connection through the vendor' : 'Entered manually'],
      ['Account', has ? `${S.pay.type} &bull;&bull;&bull;&bull;${last4()}` : 'Not connected yet'],
      ['Holder name', has ? (v ? `${isOrg() ? ORG : PERSON}, matched by the vendor` : holder()) : '-'],
      ...(v ? [] : [['Bank statement', S.removed.stmt ? 'Missing' : 'Uploaded']]),
      ['Status', !S.paySaved ? 'Not submitted' : v ? 'Approved automatically' : 'In compliance review']];
    return `<h3>Payout account</h3>${caseHead()}<table>${rows.map(([k, val]) => `<tr><th>${k}</th><td>${val}</td></tr>`).join('')}</table>
      <p class="muted" style="font-size:12px">Full account numbers are never shown here.</p>
      <h2>Audit log</h2>${audit(['Campaign live', ...(S.paySaved ? [S.payout === 'vendor' ? 'Payout account connected, approved automatically' : 'Payout account added, sent to compliance review'] : [])])}`;
  }
  return `<h3>Audit log</h3>${caseHead()}${audit(i === 8 ? ['Campaign live'] : [])}`;
}

/* ---------- Path map ---------- */
function mapNode(label, sub, set, extra) {
  const cur = Object.keys(set).every(k => k === 'step' ? S.step === set.step : S[k] === set[k]);
  return `<button class="node ${extra || ''} ${cur ? 'cur' : ''}" data-set='${JSON.stringify(set)}'>${label}${sub ? `<small>${sub}</small>` : ''}</button>`;
}
function pathMap() {
  const p = isOrg() ? '' : 'faded';
  const st = (n, nodes) => `<div class="stage"><div class="sname">${n}</div><div class="nodes">${nodes}</div></div>`;
  return `<div class="map"><div style="display:flex;justify-content:space-between;align-items:center"><h1 style="padding:0;margin:0">All paths</h1><button class="x" data-act="closemap">&times;</button></div>
  <div class="legend"><span><span class="sw" style="border:2px solid var(--teal)"></span>Changes with vendor</span><span><span class="sw" style="background:var(--low-tint)"></span><span class="sw" style="background:var(--medium-tint)"></span><span class="sw" style="background:var(--high-tint)"></span><span class="sw" style="background:var(--declined-tint)"></span>Score bands</span><span><span class="sw" style="border-style:dashed;opacity:.4"></span>Skipped on the person path</span><span>Outline = where you are. Click any step to jump there.</span></div>
  ${st('1. Sign up', mapNode('Sign up', 'Login only', { step: 0 }))}
  ${st('2. Applicant', `<div><div class="seg">${[['org', '🏢 Organization'], ['person', '👤 Person']].map(([v, l]) => `<button class="${S.app === v ? 'on' : ''}" data-k="app" data-v="${v}">${l}</button>`).join('')}</div><div class="muted" style="font-size:12px;margin-top:6px">${isOrg() ? 'Create or join an organization. All steps apply.' : 'Personal account. Organization steps are faded below.'}</div></div>`)}
  ${st('3. Campaign', mapNode('Save as draft', 'Stops here, no checks', { step: 2, draft: true }, 'end') + mapNode('Continue to go live', '', { step: 3, draft: false }))}
  ${st('4. Risk form', mapNode('About you', 'Everyone', { step: 3 }) + mapNode('About your organization', 'Organizations only', { step: 3, app: 'org' }, p))}
  ${st('5. Check', ['low', 'medium', 'high', 'declined'].map(o => mapNode(BAND[o], { low: 'Goes live now, verifies while live', medium: 'Reviewer first', high: 'Compliance first', declined: 'Ends, generic message' }[o], { step: 4, outcome: o }, 'b-' + o + (o === 'declined' ? ' end' : ''))).join(''))}
  ${st('6. Verification', mapNode('In-house', 'Upload ID' + (isOrg() ? ', company documents' : ''), { step: 5, mode: 'inhouse' }, 'v') + mapNode('With vendor', 'ID scan and selfie', { step: 5, mode: 'vendor' }, 'v') + mapNode('Registry lookup', 'Vendor, organizations only', { step: 5, mode: 'vendor', app: 'org', registry: true }, 'v ' + p) + mapNode('Registry not reachable', 'Falls back to upload', { step: 5, mode: 'vendor', app: 'org', registry: false }, 'v ' + p))}
  ${st('7. Review', mapNode('Reviewer checks documents', 'In-house. Low is live meanwhile, others wait as a draft', { step: 6, mode: 'inhouse' }, 'v') + mapNode('Verified automatically', 'With vendor, pass', { step: 6, mode: 'vendor', vendorResult: 'pass', registry: true }, 'v') + mapNode('Reviewer checks company documents', 'With vendor, registry not reachable. Low is live meanwhile', { step: 6, mode: 'vendor', vendorResult: 'pass', app: 'org', registry: false }, 'v ' + p) + mapNode('Back to compliance', 'With vendor, low result. Waits as a draft', { step: 6, mode: 'vendor', vendorResult: 'low' }, 'v'))}
  ${st('8. Message', mapNode('Under review', 'In-house', { step: 7, mode: 'inhouse' }, 'v') + mapNode('You\'re verified', 'With vendor, pass', { step: 7, mode: 'vendor', vendorResult: 'pass', registry: true }, 'v') + mapNode('Organization under review', 'With vendor, registry not reachable', { step: 7, mode: 'vendor', vendorResult: 'pass', app: 'org', registry: false }, 'v ' + p) + mapNode('A little more time', 'With vendor, low result', { step: 7, mode: 'vendor', vendorResult: 'low' }, 'v'))}
  ${st('9. Go live', mapNode('Campaign live', 'More documents may be requested later', { step: 8 }))}
  ${st('10. Payout', mapNode('Enter manually', 'Details and bank statement, compliance review', { step: 9, payout: 'manual' }, 'v') + mapNode('Connect your bank', 'Log in through the vendor, approved automatically', { step: 9, payout: 'vendor' }, 'v'))}
  </div>`;
}

/* ---------- Render ---------- */
function render() {
  seg('seg-app', [['org', '🏢 Organization'], ['person', '👤 Person']], 'app');
  $('btn-admin').classList.toggle('on', S.admin);
  $('btn-admin').classList.toggle('pulse', S.step === 3 && !S.admin);
  $('bar').style.width = ((S.step + 1) / STEPS.length * 100) + '%';
  $('steps').innerHTML = STEPS.map((s, k) => `<span class="${k === S.step ? 'cur' : ''} ${VENDOR_STEPS.includes(k) ? 'vend' : ''}" data-go="${k}" role="button" tabindex="0">${k + 1}. ${s}</span>`).join('');
  const u = userScreen(S.step);
  const isV = VENDOR_STEPS.includes(S.step);
  const blocked = S.step === 4 && S.outcome === 'declined';
  const nav = u.nav || `<button class="btn2" data-act="back" ${S.step === 0 ? 'disabled' : ''}>Back</button><button class="btn" data-act="next" ${S.checking || blocked ? 'disabled' : ''}>Continue</button>`;
  $('user').innerHTML = `<div class="card ${isV ? 'vendor' : ''}">${isV ? '<span class="pill">Changes with vendor</span>' : ''}
    <div class="eyebrow">Step ${S.step + 1} of ${STEPS.length}</div>${isV ? `<div class="modebar" style="margin-top:8px"><span class="seglabel">${S.step === 9 ? 'Payout account' : 'Verification'}</span>${S.step === 9 ? demoSeg('payout', [['manual', 'Enter manually'], ['vendor', 'Connect your bank']]) : demoSeg('mode', [['inhouse', 'In-house'], ['vendor', 'With vendor']])}</div>` : ''}<h1>${u.h}${u.tag ? `<span class="tag">${u.tag}</span>` : ''}</h1>${u.body}<div class="nav">${nav}</div></div>`;
  const a = $('admin');
  a.hidden = !S.admin;
  if (S.admin) a.innerHTML = adminHead() + adminScreen(S.step);
  const o = $('overlay');
  o.hidden = !S.map;
  if (S.map) o.innerHTML = pathMap();
}
function go(step) {
  S.step = Math.max(0, Math.min(STEPS.length - 1, step));
  if (S.step === 4) { S.checking = true; setTimeout(() => { S.checking = false; render(); }, 1200); }
  render(); window.scrollTo({ top: 0, behavior: 'smooth' });
}
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { S.draft = false; go(+g.dataset.go); return; }
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.k) { if (b.dataset.k === 'payout') S.paySaved = false; let v = b.dataset.v; if (v === 'true') v = true; if (v === 'false') v = false; S[b.dataset.k] = v; render(); return; }
  if (b.dataset.set) { Object.assign(S, JSON.parse(b.dataset.set)); S.map = false; S.checking = false; render(); return; }
  if (b.id === 'btn-admin') { S.admin = !S.admin; render(); return; }
  if (b.id === 'btn-map') { S.map = true; render(); return; }
  switch (b.dataset.act) {
    case 'next': if (S.step === 2) S.draft = false; if (S.step === 5) S.approved = false; S.resumed = false; go(S.step + 1); break;
    case 'back': go(S.step - 1); break;
    case 'draft': S.draft = true; S.resumed = false; S.draftStep = S.step; go(1); break;
    case 'resume': S.draft = false; S.resumed = true; go(S.draftStep); break;
    case 'up': delete S.removed[b.dataset.key]; render(); break;
    case 'rmup': S.removed[b.dataset.key] = true; render(); break;
    case 'submit': S.outcome = computedBand(); go(4); break;
    case 'addperson': S.form.people.push({ name: '', role: 'Director', own: '0' }); render(); break;
    case 'rmperson': S.form.people.splice(+b.dataset.i, 1); render(); break;
    case 'link': S.linked = true; render(); break;
    case 'unlink': S.linked = false; render(); break;
    case 'paysave': S.paySaved = true; render(); break;
    case 'restart': Object.assign(S, { draft: false, outcome: 'low', registry: true, vendorResult: 'pass', approved: false, removed: {}, draftStep: 2, linked: false, paySaved: false }); go(0); break;
    case 'closeadmin': S.admin = false; render(); break;
    case 'closemap': S.map = false; render(); break;
  }
});
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>';
const isDark = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')) === 'dark';
function paintTheme() { const d = isDark(); $('btn-theme').innerHTML = d ? SUN : MOON; $('btn-theme').title = d ? 'Switch to light mode' : 'Switch to dark mode'; }
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
$('btn-theme').addEventListener('click', () => {
  const t = isDark() ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem('theme', t); } catch (e) {}
  paintTheme();
});
paintTheme();
const adminHead = () => `<div class="ahead"><span class="albl">Admin &middot; compliance and trust and safety</span><button class="x" data-act="closeadmin">&times;</button></div>`;
function onField(e, full) {
  const t = e.target;
  if (t.dataset.p) { S.pay[t.dataset.p] = t.value; if (full) render(); else $('paysave').disabled = !payOk(); return; }
  if (t.dataset.f) S.form[t.dataset.f] = t.value;
  else if (t.dataset.pf) S.form.people[+t.dataset.pi][t.dataset.pf] = t.value;
  else return;
  S.outcome = computedBand();
  if (full) render(); else if (S.admin) $('admin').innerHTML = adminHead() + adminScreen(S.step);
}
document.addEventListener('input', e => onField(e, e.target.tagName === 'SELECT'));
document.addEventListener('change', e => onField(e, true));
$('overlay').addEventListener('click', e => { if (e.target.id === 'overlay') { S.map = false; render(); } });
render();
</script>
</body>
</html>
