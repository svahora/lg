    if (d.review) { const x = S.list.find(y => y.fid === d.review && y.source === 'auto'); x.review = d.to; ev('ads_compliance_decision', { fundraiser_id: x.fid, account_id: FUND[x.fid].acct, decision: d.to, purchase: x.status }, true); toast(d.to === 'approved' ? 'Approved' : 'Rejected and removed from the list'); render(); return; }
    if (d.act === 'addAcc') { const id = ($('#accId').value || '').trim().toUpperCase(); if (!id) { toast('Enter an account ID'); return; } const known = Object.values(FUND).find(f => f.acct === id); S.accounts.push({ aid: id, org: known ? known.org : 'New account', by: 'You (Compliance)', at: 'Today', trial: $('#accTrial').checked }); ev('ads_account_approved', { account_id: id, trial_graduate: $('#accTrial').checked }, true); toast('Account approved'); render(); return; }
    if (d.newfr) {
      const a = S.accounts.find(x => x.aid === d.newfr); S.autoSeq++;
      const fid = 'F-2' + (2000 + S.autoSeq);
      FUND[fid] = { title: 'New fundraiser ' + S.autoSeq, acct: a.aid, org: a.org, raised: 0, goal: 10000 };
      S.list.push({ fid, list: 'seasonal', source: 'auto', by: 'Auto-added', at: 'Just now', review: 'pending', status: 'Not purchased' });
      ev('ads_fundraiser_auto_added', { fundraiser_id: fid, account_id: a.aid, list: 'seasonal' }, true);
      if (!soldOut(S.live)) ev('ads_creator_notified', { fundraiser_id: fid, channels: 'page_alert, in_app, email' }, true);
      toast(`${fid} added to the seasonal list, waiting for Compliance`); render(); return;
    }
    if (d.slot) { const p = S.packages.find(x => x.id === d.slot); p.slots = Math.max(p.sold, p.slots + +d.d); ev('ads_package_slots_changed', { package: p.id, slots: p.slots }, true); render(); return; }
    if (d.toggle) { const p = S.packages.find(x => x.id === d.toggle); p.on = !p.on; ev('ads_package_visibility_changed', { package: p.id, shown: p.on }, true); toast(`${p.name} ${p.on ? 'shown' : 'hidden'} at checkout`); render(); return; }
    if (d.setopen) { S.setOpen = d.setopen; render(); return; }
    if (d.act === 'setsBack') { S.setOpen = null; render(); return; }
    if (d.golive) { makeLive(d.golive, 'manual'); render(); return; }
    if (d.act === 'jump') { const nx = S.sets.find(x => x.status === 'scheduled'); if (nx) makeLive(nx.id, 'schedule'); render(); return; }
    if (d.schedule) { const v = ($('#schedDate') || {}).value; if (!v) { toast('Pick a date'); return; } const x = S.sets.find(y => y.id === d.schedule); S.sets.forEach(y => { if (y.status === 'scheduled' && y !== x) y.status = 'draft'; }); x.status = 'scheduled'; x.goLive = new Date(v + 'T00:00:00Z').toLocaleDateString('en-US', { month: 'short', day: 'numeric', timeZone: 'UTC' }); ev('ads_package_set_scheduled', { set: x.id, go_live: v }, true); toast(`${x.name} scheduled for ${x.goLive}`); render(); return; }
    if (d.unschedule) { const x = S.sets.find(y => y.id === d.unschedule); x.status = 'draft'; delete x.goLive; toast('Unscheduled'); render(); return; }
    if (d.dup || d.act === 'createSet') {
      const from = d.dup || ($('#fromSet') || {}).value; const src = S.sets.find(y => y.id === from);
      const name = d.dup ? `${src.name} copy` : (($('#newSet') || {}).value || '').trim(); if (!name) { toast('Name the package set'); return; }
      S.setSeq++; const id = 'set' + S.setSeq;
      S.sets.push({ id, name, blurb: src ? src.blurb : 'New season', salesOpen: 'TBD', start: 'TBD', status: 'draft', cap: src && src.kind !== 'test' ? src.cap : 50000, open: true, kind: src && src.kind === 'test' ? 'test' : undefined });
      if (src) pkgsFor(src.id).forEach((p, i) => S.packages.push({ ...p, id: `${id}-${i}`, season: id, sold: 0, perks: [...p.perks] }));
      ev('ads_package_set_created', { set: id, copied_from: src ? src.id : 'blank' }, true); toast(`${name} created as a draft`); S.setOpen = id; render(); return;
    }
    if (d.addpkg) { const nm = ($('#pName').value || '').trim(); const pr = +$('#pPrice').value, dy = +$('#pDays').value || 14, sl = +$('#pSlots').value || 10; if (!nm || !pr) { toast('Add a name and price'); return; } S.packages.push({ id: d.addpkg + '-' + Date.now(), season: d.addpkg, name: nm, price: pr, days: dy, slots: sl, sold: 0, on: true, perks: ['Homepage rotation'] }); ev('ads_package_added', { set: d.addpkg, package: nm }, true); render(); return; }
    if (d.cap) { const x = S.sets.find(y => y.id === S.setOpen); x.cap = Math.max(5000, x.cap + +d.cap); ev('ads_season_cap_changed', { set: x.id, cap: x.cap }, true); render(); return; }
    if (d.sales) { const x = S.sets.find(y => y.id === d.sales); x.open = !x.open; ev(x.open ? 'ads_season_sales_opened' : 'ads_season_sales_closed', { set: x.id }, true); toast(`${x.name} sales ${x.open ? 'open' : 'closed'}`); render(); return; }
  });

  document.addEventListener('change', e => { if (e.target.id === 'insQ') { S.q = e.target.value; render(); } });
  document.addEventListener('input', e => { if (e.target.id === 'fHead') { const el = $('#pvHead'); if (el) el.textContent = e.target.value || FUND[S.who].title; } });
  $('#who').addEventListener('change', e => { S.who = e.target.value; S.step = 'page'; S.pkg = null; S._viewed = false; S.bell = false; S.read = false; S.view = 'creator'; render(); });
  $('#reqToggle').addEventListener('change', e => document.body.classList.toggle('show-req', e.target.checked));
  $('#engToggle').addEventListener('change', e => document.body.classList.toggle('show-eng', e.target.checked));
  $('#evToggle').addEventListener('change', e => document.body.classList.toggle('show-ev', e.target.checked));
  $('#reset').addEventListener('click', () => { fresh(); evs.length = 0; renderEv(); render(); toast('Reset'); });
  render();
})();
</script>
</body>
</html>
