<style>
/* Layout: prototype controls on top, one phone-sized app below (full screen on a real phone).
   Tokens copied from a design system (tokens/colors.css, typography.css, spacing.css). Light mode only. */
:root{
  color-scheme:light;
  --brand-50:#EDF7F0;--brand-100:#D8EEDF;--brand-500:#4AA567;--brand-600:#3C8653;--brand-700:#2C633D;
  --neutral-0:#FFFFFF;--neutral-50:#FAFAFA;--neutral-100:#F5F5F5;--neutral-200:#E5E5E5;--neutral-300:#D4D4D4;--neutral-400:#A3A3A3;--neutral-500:#737373;--neutral-600:#525252;--neutral-700:#404040;--neutral-800:#262626;--neutral-900:#171717;
  --red-50:#FEF2F2;--red-700:#B91C1C;--yellow-50:#FEFCE8;--yellow-700:#A16207;--yellow-800:#854D0E;--green-50:#F0FDF4;--green-700:#15803D;
  --indigo-50:#EEF2FF;--indigo-700:#4338CA;--purple-700:#7E22CE;--blue-50:#EFF6FF;--blue-700:#1D4ED8;
  --text-primary:var(--neutral-900);--text-secondary:var(--neutral-600);--text-tertiary:var(--neutral-500);
  --surface-page:var(--neutral-0);--surface-subtle:var(--neutral-100);--border-subtle:var(--neutral-200);--border-default:var(--neutral-300);
  --font-sans:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --radius-lg:8px;--radius-xl:12px;--radius-2xl:16px;--radius-full:9999px;
  --shadow-xs:0 1px 2px 0 rgba(0,0,0,.05);--shadow-sm:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1);--shadow-xl:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1);
  --ease:cubic-bezier(.4,0,.2,1);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--neutral-100);color:var(--text-primary);font:400 16px/24px var(--font-sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
h1,h2,h3{margin:0;font-weight:700;letter-spacing:-.0167em}
p{margin:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;flex:none}
svg.i.sm{width:20px;height:20px}
.stage{min-height:100%;display:flex;flex-direction:column;align-items:center;gap:16px;padding-block:20px 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.controls{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:center;max-width:760px;font-size:13px;color:var(--text-secondary)}
.controls .grp{display:flex;align-items:center;gap:6px}
.seg{display:inline-flex;background:var(--neutral-0);border:1px solid var(--border-subtle);border-radius:var(--radius-full);padding:2px}
.seg button{border:0;background:transparent;border-radius:var(--radius-full);padding:4px 12px;font:600 12px/16px var(--font-sans);color:var(--text-secondary)}
.seg button[aria-pressed="true"]{background:var(--neutral-900);color:var(--neutral-0)}
.device{position:relative;width:390px;max-width:100%;height:820px;max-height:calc(100vh - 110px);min-height:600px;background:var(--surface-page);border-radius:40px;border:8px solid var(--neutral-900);box-shadow:var(--shadow-xl);overflow:hidden;display:flex;flex-direction:column}
@media (max-width:480px){
  .stage{padding:0;gap:0}
  .controls{padding:8px 12px;background:var(--neutral-0);border-bottom:1px solid var(--border-subtle);width:100%}
  .device{width:100%;height:calc(100vh - 96px);max-height:none;border:0;border-radius:0;box-shadow:none}
}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.scroll,.chips,.sheet .sb{scrollbar-width:none;-ms-overflow-style:none}
.scroll::-webkit-scrollbar,.chips::-webkit-scrollbar,.sheet .sb::-webkit-scrollbar{display:none}
.bar{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:14px 16px 10px;background:rgba(255,255,255,.9);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar h1{font-size:18px;line-height:24px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{border:0;background:transparent;width:36px;height:36px;border-radius:var(--radius-full);display:grid;place-items:center;flex:none}
.iconbtn:hover{background:var(--neutral-100)}
.mark{width:28px;height:28px;flex:none}
.content{padding:4px 16px 24px;display:flex;flex-direction:column;gap:16px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 8px;border-radius:var(--radius-full);font:500 12px/16px var(--font-sans);white-space:nowrap;border:1px solid transparent}
.badge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.nodot::before{display:none}
.badge.green{background:var(--green-50);color:var(--green-700);border-color:rgba(21,128,61,.1)}
.badge.yellow{background:var(--yellow-50);color:var(--yellow-800);border-color:rgba(161,98,7,.1)}
.badge.indigo{background:var(--indigo-50);color:var(--indigo-700);border-color:rgba(67,56,202,.1)}
.badge.neutral{background:var(--neutral-100);color:var(--neutral-700)}
.badge.red{background:var(--red-50);color:var(--red-700)}
.card{background:var(--neutral-0);border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:16px}
.raised b{display:block;font-size:24px;line-height:30px;font-weight:700;font-variant-numeric:tabular-nums}
.raised .sub{font-size:14px;line-height:20px;color:var(--text-secondary)}
.prog{height:8px;border-radius:var(--radius-full);background:var(--neutral-200);overflow:hidden;margin:10px 0 8px}
.prog i{display:block;height:100%;background:var(--brand-500);border-radius:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-full);font:700 14px/20px var(--font-sans);padding:10px 20px;border:1px solid transparent;transition:background .15s var(--ease)}
.btn.full{width:100%}
.btn.primary{background:var(--neutral-900);color:#fff;box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--neutral-800)}
.btn.brand{background:var(--brand-500);color:#fff;box-shadow:var(--shadow-sm)}
.btn.brand:hover{background:var(--brand-600)}
.btn.secondary{background:#fff;color:var(--text-primary);border-color:var(--border-default);box-shadow:var(--shadow-xs)}
.btn.secondary:hover{background:var(--neutral-50)}
.btn.tertiary{background:transparent}
.btn.sm{padding:6px 14px;font-size:13px}
.coach{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--brand-100);background:var(--brand-50);border-radius:var(--radius-full);padding:10px 14px;font:500 14px/20px var(--font-sans);color:var(--text-primary)}
.coach .dot{width:28px;height:28px;border-radius:50%;background:var(--brand-500);color:#fff;display:grid;place-items:center;flex:none}
.coach .dot svg{width:16px;height:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.grid>.tile:last-child:nth-child(odd){grid-column:span 2;min-height:0}
.tile,.row .main,.content>*{min-width:0}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;border:1px solid var(--border-subtle);background:#fff;border-radius:var(--radius-2xl);padding:14px;min-height:150px;box-shadow:var(--shadow-xs);transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.tile:hover{border-color:var(--neutral-300);box-shadow:var(--shadow-sm)}
.tile .ic{width:40px;height:40px;border-radius:var(--radius-xl);background:var(--neutral-100);display:grid;place-items:center}
.tile b{font-size:16px;line-height:22px;font-weight:700}
.tile span.d{font-size:12px;line-height:16px;color:var(--text-secondary)}
.tile .badge{margin-top:auto;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.tile.hl{border-color:var(--indigo-700);background:var(--indigo-50)}
.tile.hl .ic{background:#fff;color:var(--indigo-700)}
.ramban{border-radius:var(--radius-xl);padding:14px 16px;color:#fff;background:linear-gradient(120deg,var(--indigo-700),var(--purple-700));display:flex;gap:12px;align-items:center}
.ramban b{display:block;font-size:15px;line-height:20px}
.ramban span{font-size:13px;line-height:18px;opacity:.9}
.adminrow{display:flex;align-items:center;gap:10px;border:1px dashed var(--neutral-400);border-radius:var(--radius-xl);padding:10px 14px;background:var(--neutral-50);font:600 13px/18px var(--font-sans);width:100%;text-align:left}
.sect h2{font-size:16px;line-height:24px;margin-bottom:8px}
.sect .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.sect .hd h2{margin:0}
.link{border:0;background:none;padding:0;font:600 13px/18px var(--font-sans);color:var(--brand-600);text-decoration:underline;text-underline-offset:2px}
.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border-subtle);font-size:14px;line-height:20px;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.row:last-child{border-bottom:0}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-50);color:var(--brand-700);display:grid;place-items:center;font:700 13px var(--font-sans);flex:none}
.row .main{flex:1;min-width:0}
.row .main b{display:block;font-weight:600}
.row .main span{color:var(--text-tertiary);font-size:12px;line-height:16px}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.chip{border:1px solid var(--border-default);background:#fff;border-radius:var(--radius-full);padding:6px 12px;font:600 13px/18px var(--font-sans);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--neutral-900);border-color:var(--neutral-900);color:#fff}
.setting{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--border-subtle)}
.setting:last-child{border-bottom:0}
.setting .txt{flex:1;min-width:0}
.setting b{display:block;font-size:15px;line-height:22px;font-weight:600}
.setting span{display:block;font-size:13px;line-height:18px;color:var(--text-secondary)}
.sw{width:44px;height:24px;padding:2px;border:0;border-radius:var(--radius-full);background:var(--neutral-300);display:flex;justify-content:flex-start;align-items:center;flex:none;transition:background .15s var(--ease)}
.sw[aria-checked="true"]{background:var(--brand-500);justify-content:flex-end}
.sw i{width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font:600 13px/18px var(--font-sans)}
.input{border:1px solid var(--border-default);border-radius:var(--radius-lg);padding:10px 12px;font:400 15px/22px var(--font-sans);background:#fff;width:100%;color:var(--text-primary)}
.input:focus{outline:none;border-color:var(--brand-500);box-shadow:0 0 0 3px var(--brand-100)}
.input[readonly]{background:var(--neutral-50);color:var(--text-secondary)}
.lock{display:flex;gap:6px;align-items:center;font-size:12px;line-height:16px;color:var(--text-tertiary)}
.note{font-size:13px;line-height:18px;color:var(--text-secondary)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hbar .lbl{display:flex;justify-content:space-between;font-size:13px;line-height:18px;margin-bottom:4px}
.hbar .lbl b{font-weight:600}
.hbar .trk{height:8px;border-radius:var(--radius-full);background:var(--neutral-100);overflow:hidden}
.hbar .trk i{display:block;height:100%;background:var(--brand-500);border-radius:inherit}
.vbars{display:flex;align-items:flex-end;gap:8px;height:96px;padding-top:8px}
.vbars div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--text-tertiary);height:100%;justify-content:flex-end}
.vbars i{width:100%;background:var(--brand-500);border-radius:6px 6px 2px 2px}
.vbars i.off{background:var(--brand-100)}
.tabbar{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--border-subtle);background:#fff;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font:600 11px/14px var(--font-sans);color:var(--neutral-500);padding:4px 0}
.tabbar button[aria-current="page"]{color:var(--neutral-900)}
.tabbar button[aria-current="page"] svg{stroke-width:2}
.scrim{position:absolute;inset:0;background:rgba(23,23,23,.5);z-index:10;display:flex;align-items:flex-end;animation:fade .3s var(--ease)}
.sheet{background:#fff;width:100%;max-height:88%;border-radius:16px 16px 0 0;display:flex;flex-direction:column;animation:up .3s var(--ease)}
.sheet .sh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border-subtle)}
.sheet .sh h2{flex:1;font-size:17px;line-height:24px}
.sheet .sb{padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet .sf{padding:12px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border-subtle);display:flex;gap:8px}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.msg{max-width:86%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:20px}
.msg.u{align-self:flex-end;background:var(--neutral-900);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:var(--neutral-100);border-bottom-left-radius:4px}
.confirm{align-self:flex-start;max-width:92%;border:1px solid var(--yellow-700);background:var(--yellow-50);border-radius:var(--radius-xl);padding:12px 14px;font-size:14px;line-height:20px;display:flex;flex-direction:column;gap:8px}
.confirm b{font-weight:700}
.confirm ul{margin:0;padding-left:18px}
.confirm .acts{display:flex;gap:8px}
.coachcard{border:1px solid var(--brand-200,#B5DEC2);background:var(--brand-50);border-radius:var(--radius-2xl);padding:14px 16px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:20px}
.coachcard .ah{display:flex;align-items:center;gap:8px}
.coachcard .ah b{font-size:15px}
.coachcard .dot{width:28px;height:28px;border-radius:50%;background:var(--brand-500);color:#fff;display:grid;place-items:center;flex:none}
.coachcard .dot svg{width:16px;height:16px}
.coachcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;border:1px solid var(--border-default);background:#fff;border-radius:var(--radius-xl);padding:12px 14px;font-size:14px;line-height:20px}
.opt b{font-weight:600;display:block}
.opt small{color:var(--text-tertiary);font-size:12px}
.opt[aria-pressed="true"]{border-color:var(--brand-500);box-shadow:0 0 0 1px var(--brand-500) inset;background:var(--brand-50)}
.stepper{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.stepper .st{display:flex;align-items:center;gap:8px;border:1px solid var(--border-default);border-radius:var(--radius-full);padding:2px}
.stepper .st b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.stepper .iconbtn{width:32px;height:32px;font:600 18px var(--font-sans)}
.nights{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.night{border:1px solid var(--border-default);border-radius:var(--radius-lg);text-align:center;padding:6px 0;font:700 13px/16px var(--font-sans)}
.night small{display:block;font:500 10px/14px var(--font-sans);color:var(--text-tertiary)}
.night.last{border-color:var(--indigo-700);background:var(--indigo-50)}
.night.taken{background:var(--neutral-100);border-color:var(--neutral-200);color:var(--neutral-400)}
.ideabar{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--border-subtle);background:#fff;border-radius:var(--radius-xl);padding:12px 14px}
.ideabar .ic,.idea .ic{width:36px;height:36px;border-radius:var(--radius-lg);background:var(--neutral-100);display:grid;place-items:center;flex:none}
.ideabar .main{flex:1;min-width:0}.ideabar small{display:block;font-size:12px;color:var(--text-tertiary)}.ideabar b{font-size:15px}
.ideas{display:flex;flex-direction:column;gap:8px}
.idea{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--border-subtle);background:#fff;border-radius:var(--radius-xl);padding:12px}
.idea .main{flex:1;min-width:0}.idea b{display:block;font-size:14px;line-height:20px}.idea span.main span{font-size:12px;line-height:16px;color:var(--text-secondary)}
.idea.top{border-color:var(--brand-500);box-shadow:0 0 0 1px var(--brand-500) inset}
.idea.soon{opacity:.6}
.opt.out{opacity:.55}.opt small.so{color:var(--red-700);font-weight:600}
.qbox{display:flex;flex-direction:column;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--border-default)}
.req{font:600 11px var(--font-sans);color:var(--text-tertiary)}
.qrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border-subtle);font-size:13px}
.qrow:last-child{border-bottom:0}
.seg3{display:grid;grid-template-columns:repeat(3,auto);background:var(--neutral-100);border-radius:var(--radius-full);padding:2px;flex:none}
.seg3 button{border:0;background:none;border-radius:var(--radius-full);padding:4px 8px;font:600 11px/14px var(--font-sans);color:var(--text-secondary)}
.seg3 button[aria-pressed="true"]{background:#fff;color:var(--text-primary);box-shadow:var(--shadow-xs)}
.greet{font-size:22px;line-height:28px;font-weight:700;letter-spacing:-.0167em}
.raised b.big{font-size:36px;line-height:40px;color:var(--brand-600)}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;border-top:1px solid var(--border-subtle);margin-top:12px;padding-top:12px}
.stats.sx{margin-top:0;border-top:1px solid var(--border-subtle)}
.stats b{display:block;font-size:18px;line-height:24px;font-variant-numeric:tabular-nums}.stats span{font-size:11px;line-height:14px;color:var(--text-secondary)}
.brief{border:1px solid var(--border-subtle);background:linear-gradient(180deg,var(--brand-50),#fff 60%);border-radius:var(--radius-2xl);padding:16px;display:flex;flex-direction:column;gap:12px}
.brief .bh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.brief .bh b{font-size:16px}
.brief .dot{width:28px;height:28px;border-radius:50%;background:var(--brand-500);color:#fff;display:grid;place-items:center;flex:none}.brief .dot svg{width:16px;height:16px}
.bi{display:flex;gap:10px;font-size:14px;line-height:20px}.bic{width:30px;height:30px;border-radius:50%;border:1px solid var(--border-subtle);background:#fff;display:grid;place-items:center;flex:none;color:var(--brand-600)}
.brief .acts{display:flex;flex-wrap:wrap;gap:8px}
.map{border-radius:var(--radius-xl);background:var(--neutral-50);border:1px solid var(--border-subtle);overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map .land{fill:var(--neutral-200)}
.map .arc{fill:none;stroke:var(--brand-500);stroke-width:.7;opacity:.7}
.map .halo{fill:var(--brand-500);opacity:.18}.map .cdot{fill:var(--brand-600)}
.map .thalo{fill:var(--yellow-700);opacity:.25}.map .tdot{fill:var(--yellow-700);stroke:#fff;stroke-width:.8}
.map .tlbl{font:700 8px var(--font-sans);fill:var(--text-primary)}
.city{margin-top:10px}.city .lbl{display:flex;justify-content:space-between;font-size:14px;line-height:20px;margin-bottom:4px}.city .cty{color:var(--text-tertiary)}
.city .trk{height:6px;border-radius:var(--radius-full);background:var(--neutral-100);overflow:hidden}.city .trk i{display:block;height:100%;background:var(--brand-500);border-radius:inherit}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--border-subtle);border-radius:var(--radius-xl);padding:10px 12px}
.step .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--neutral-300);flex:none;display:grid;place-items:center;color:var(--brand-600)}
.step.done .ck{border:0}.step.done .ck svg{width:24px;height:24px}

ate.", "Owners don't know what to do next. A short daily plan is the core of the coach approach.", "Nothing like it."], "basics": ["Edit the title, goal, image, end date and story. Locked fields stay visible with the reason.", "Parity. The lock reasons are new: today a field just shows a lock icon.", "3.0 Get Started and Tell Your Story."], "levels": ["Giving levels with a limit per option and questions donors answer (shipping address, a note, emergency contact).", "Parity with 3.0 giving levels, including Qurbani limits and thank-you items.", "3.0 Giving Levels."], "coachoffer": ["Coach reads the story and proposes a full offering, like sponsor a baby at $50 a week, shown in a live donor preview.", "Offerings shape how much a fundraiser raises, and most owners can't design a good one alone.", "Nothing like it."], "recurring": ["Turn on monthly or weekly giving and set the checkout options.", "Already built in 4.0; it moves into Page.", "4.0 Recurring page."], "daily": ["Turn on daily giving that starts on a chosen date, such as the first night of Ramadan. Donors sign up early and are charged daily from then.", "Seasonal giving, especially Ramadan, works best day by day.", "The backend has a daily frequency, but owners can't turn it on."], "p2p": ["Turn on peer-to-peer, manage participants and teams, and set event details.", "Already built in 4.0; it moves into Page.", "4.0 Peer-to-peer page, behind a flag."], "zakat": ["Declare Zakat eligibility, who benefits and how funds are spent, and see the review status.", "Parity, given its own section so it isn't buried.", "3.0 Enhance section."], "donors": ["The donor list with filters, offline donations, refunds and export.", "Parity.", "3.0 Donors tab."], "reach": ["Pick the people closest to you; Coach drafts a personal message for each, and you track who has one.", "One-to-one messages to close contacts bring the first donations, more than social posts.", "Nothing like it."], "thank": ["See who hasn't been thanked and  const ns=app.querySelector('.scroll');if(ns&&S.keepScroll)ns.scrollTop=top;S.keepScroll=false;
 const sb=app.querySelector('.sheet .sb');if(sb&&S.sheet==='coach')sb.scrollTop=sb.scrollHeight;
 document.querySelectorAll('[data-c]').forEach(b=>{const v=b.dataset.c==='staff'?String(+S.staff):S[b.dataset.c];b.setAttribute('aria-pressed',String(b.dataset.v===v));});}
let tt;function toast(t){S.toast=t;clearTimeout(tt);tt=setTimeout(()=>{S.toast=null;render();},2600);}
function go(r){const al={donations:'supporters/donors','grow/reach':'supporters/reach','donations/thanks':'supporters/thank'};if(al[r])r=al[r];if(r.startsWith('supporters:')){const f=r.split(':')[1];if(f==='reach'||f==='messaged'){S.sFilter=f;r='supporters/reach';}else r=f==='thank'?'supporters/thank':'supporters/donors';}S.route=r;S.sheet=null;render();}
function ask(q){S.chat.push({w:'u',t:q});
 if(/climb/i.test(q)){S.chat.push({w:'a',t:'You’re #7 in Most raised tonight, $340 USD behind Masjid Al-Noor Food Drive. The last 10 nights reward momentum, so two things help most:<br>1. Message the 3 people close to you who haven’t heard from you yet (<button class="link" data-go="supporters:reach">Supporters</button>).<br>2. Post a short update after Taraweeh: “We’re #7 tonight, help us reach the top 5, inshaAllah.” <button class="link" data-act="update">Post update</button>'});}
 else if(/draft an update/i.test(q)){S.chat.push({w:'a',t:'Here’s a draft for tomorrow after Jumu’ah:<br><br><b>10 incubators are running</b><br>Alhamdulillah, the first 10 incubators reached the hospital in Idlib this week. 812 of you made this possible. We’re 62% of the way, with $45,600 to go for the remaining babies. Please share this with one person today. <br><br><button class="link" data-act="update">Open in Post update</button>'});}
 else if(/reach my goal/i.test(q)){S.chat.push({w:'a',t:'$45,600 USD to go in 23 days, about $1,980 a day. The last 7 days averaged $1,450 a day. Three steps would close the gap, inshaAllah:<br>1. Turn on monthly giving (<button class="link" data-go="page/recurring">Recurring</button>).<br>2. Post an update after Jumu’ah tomorrow.<br>3. Message the 4 people close to you who haven’t heard from you yet (<button class="link" data-go="supporters:reach">Supporters</button>).'});}
 else if(/thank/i.test(q)){S.chat.push({w:'a',t:S.thankedAll?'Everyone who gave has been thanked, mashaAllah. I’ll let you know when new donors are waiting.':'48 people are waiting. Start with the Masjid bake sale ($640 USD), Mariam Ali, who gave twice, and Yusuf Khan, your newest monthly donor. I’ve drafted a thank-you for each, in your words. <button class="link" data-go="supporters:thank">Open Supporters</button>'});}
 else if(/from my story/i.test(q)){propose('From your story: each baby needs about a week of NICU care ($50) and a full stay is about 7 weeks ($350). You need incubators for 500 babies. Here is what I would set up. Your existing levels and their 64 donors stay in your history.',
   ['Page › Offerings: replace 3 levels with "One week of NICU care" $50 and "A full NICU stay" $350','Donors choose how many babies (1, 2, 5, 10)','Offer once or monthly','Limit to 500 babies','Allow dedications'],
   ()=>{Object.assign(S.off,{tiers:[{n:'One week of NICU care',p:50},{n:'A full NICU stay',p:350}],qty:true,monthly:true,ded:true,limit:500,unit:'babies',slots:false,suggested:true,idea:'sponsor'});S.pick=0;S.qtyN=1;},
   'Done. Your offering is updated and live on your page.','page/offerings');}
 else if(/\$1,000/.test(q)){propose('A higher option gives major donors something to aim for. I would call it "Sponsor a NICU bed for a year".',['Page › Offerings: add "Sponsor a NICU bed for a year", $1,000'],()=>{if(S.off.slots)S.off.slots=false;S.off.tiers.push({n:'Sponsor a NICU bed for a year',p:1000});},'Added. It shows as the last option.','page/offerings');}
 else if(/ramadan nights/i.test(q)){propose('Ramadan nights work well for NICU appeals: one donor sponsors each night, and the last 10 nights are priced higher because they fill first.',['Page › Offerings: switch to 30 nights of Ramadan','$100 a night, $250 for nights 21 to 30','One donor per night, dedications allowed','Your price options are kept and come back after Ramadan'],()=>{S.off.slots=true;S.off.ded=true;S.off.suggested=true;S.off.idea='nights';},'Done. The 30 nights are on your page.','page/offerings');}
 else if(/choosing/i.test(q)){S.chat.push({w:'a',t:S.off.suggested?'Since the change: 61% choose one week of NICU care, 39% a full stay, and 1 in 4 choose monthly. Most common quantity is 1.':'Last 30 days: "Feed a newborn for a week" 42 donors, "One day in an incubator" 18, "Sponsor a NICU bed" 4. Most donors give $50.'});}
 else if(/5 nights/i.test(q)){propose('I can email everyone who gave to this fundraiser when 5 nights are left.',['Donations › Updates: send an automatic email when 5 nights are left'],()=>{},'Set up. You can turn it off in Donations › Updates.','donations');}
 else if(/monthly/i.test(q)){if(S.monthly){S.chat.push({w:'a',t:'Monthly giving is already on.'});}else{propose('Monthly giving will keep your fundraiser open with no end date. Your end date is 18 Dec 2026 today.',['Page › Recurring: monthly giving on','Page › Basics: end date removed'],()=>{S.monthly=true;},'Done. Monthly giving is on and the end date is removed.','page/recurring');}}
 else if(/link/i.test(q)){const l=[...S.links].sort((a,b)=>b.amt-a.amt)[0];S.chat.push({w:'a',t:`"${l.name}": ${l.don} donations, ${money(l.amt)}. <button class="link" data-go="insights/links">Open Tracked links</button>`});}
 else if(/payout/i.test(q)){S.chat.push({w:'a',t:'Your next payout, $12,300 USD, goes to your bank account ending 4821 on Wednesday, November 25.'});}
 else if(/bank/i.test(q)&&!has('bankconnect')){S.chat.push({w:'a',t:'You can change your bank account in Money. You\u2019ll enter the new details there, and we\u2019ll send a code to the account owner to confirm. <button class="link" data-go="money">Open Money</button>'});}
 else if(/bank/i.test(q)){S.chat.push({w:'a',t:'I can start the change for you. You’ll connect the new bank in the bank’s own secure window, and we’ll send a code to the account owner to confirm. <button class="link" data-act="bankconnect">Start bank connection</button>'});}
 else S.chat.push({w:'a',t:'In this prototype, try one of the suggestions below.'});
 render();}

document.addEventListener('click',e=>{const t=e.target.closest('[data-go],[data-act],[data-tab],[data-sw],[data-filter],[data-p2ptab],[data-ask],[data-c],[data-pick],[data-qty],[data-qtyset],[data-freq],[data-idea],[data-edit],[data-q],[data-limmode],[data-mapby],[data-send],[data-person],[data-sf],[data-src],[data-pick-c],[data-board],[data-feat],[data-conf],[data-crgo],[data-crimg],[data-crgoal],[data-crzakat],[data-bank],[data-upd],[data-word],[data-finfo]');if(!t)return;
 if(t.dataset.c){const k=t.dataset.c;S[k]=k==='staff'?t.dataset.v==='1':t.dataset.v;S.keepScroll=true;render();return;}
 if(t.dataset.go){go(t.dataset.go);return;}
 if(t.dataset.tab){if(t.dataset.tab==='more'){S.sheet='more';render();}else go(t.dataset.tab);return;}
 if(t.dataset.filter){S.donFilter=t.dataset.filter;S.keepScroll=true;render();return;}
 if(t.dataset.p2ptab){S.p2pTab=t.dataset.p2ptab;S.keepScroll=true;render();return;}
 if(t.dataset.ask){S.sheet='coach';ask(t.dataset.ask);return;}
 if(t.dataset.idea){const i=IDEAS.find(x=>x.id===t.dataset.idea);if(i.soon){toast(i.n+' needs generated pages, coming later');render();return;}applyIdea(i.id);S.sheet=null;toast('Switched to '+i.n+'. Your past donors are kept.');render();return;}
 if(t.dataset.edit!=null){S.edIdx=+t.dataset.edit;S.ed=JSON.parse(JSON.stringify(S.off.tiers[S.edIdx]));S.ed.ask=S.ed.ask||{};S.sheet='opt';render();return;}
 if(t.dataset.q){syncEd();S.ed.ask[t.dataset.q]=+t.dataset.lv;render();return;}
 if(t.dataset.limmode){syncEd();S.ed.lim=+t.dataset.limmode?(S.ed.lim||100):0;if(S.ed.lim&&S.ed.left==null)S.ed.left=S.ed.lim;render();return;}
 if(t.dataset.src){S.addSrc=t.dataset.src;S.addSel=CONTACTS[t.dataset.src]?CONTACTS[t.dataset.src].filter(c=>c[2]).map(c=>c[0]):[];if(t.dataset.src==='file')S.addSel=['Zaid Haddad','Mona Aziz','Salma Idris'];S.addQ='';render();return;}
 if(t.dataset.pickC!=null){const n=t.dataset.pickC;S.addSel=t.checked?[...new Set([...S.addSel,n])]:S.addSel.filter(x=>x!==n);const sb=document.querySelector('.sheet .sb');const top=sb?sb.scrollTop:0;render();const nb=document.querySelector('.sheet .sb');if(nb)nb.scrollTop=top;return;}
 if(t.dataset.bank){S.bankSel=t.dataset.bank;return;}
 if(t.dataset.upd){const k=t.dataset.upd[0],i=+t.dataset.upd.slice(1);if(k==='d'){S.updates.splice(i,1);toast('Update deleted');}else{S.sheet='update';}S.keepScroll=true;render();return;}
 if(t.dataset.word!=null){const w=S.words[+t.dataset.word];w.h=!w.h;toast(w.h?'Comment hidden':'Comment showing');S.keepScroll=true;render();return;}
 if(t.dataset.person!=null){S.pIdx=+t.dataset.person;S.sheet='person';S.keepScroll=true;render();return;}
 if(t.dataset.sf){S.sFilter=t.dataset.sf;S.keepScroll=true;render();return;}
 if(t.dataset.send!=null){S.reach[+t.dataset.send].sent='Sent today';S.keepScroll=true;toast('Marked as sent. WhatsApp would open here.');render();return;}
 if(t.dataset.board){S.board=t.dataset.board;S.keepScroll=true;render();return;}
 if(t.dataset.crgo){S.cr.step=t.dataset.crgo;if(S.cr.step==='story'&&!S.cr.myself)S.cr.qi=3;S.crScroll=true;render();return;}
 if(t.dataset.crimg){S.cr.img=t.dataset.crimg==='upload'?'emergency':t.dataset.crimg;if(t.dataset.crimg==='upload')toast('Photo added');crNext();render();return;}
 if(t.dataset.crgoal){S.cr.goal=+t.dataset.crgoal;S.keepScroll=true;render();return;}
 if(t.dataset.crzakat){S.cr.zakat=t.dataset.crzakat;S.keepScroll=true;render();return;}
 if(t.dataset.finfo){S.fopen=S.fopen===t.dataset.finfo?null:t.dataset.finfo;render();return;}
 if(t.dataset.feat){openFeat(t.dataset.feat);return;}
 if(t.dataset.conf!=null){S.checked=true;toast('Thanks. Your answer helps Coach coach you');render();return;}
 if(t.dataset.mapby){S.mapBy=t.dataset.mapby;S.keepScroll=true;render();return;}
 if(t.dataset.pick!=null){S.pick=+t.dataset.pick;S.keepScroll=true;render();return;}
 if(t.dataset.qty){S.qtyN=Math.max(1,S.qtyN+ +t.dataset.qty);S.keepScroll=true;render();return;}
 if(t.dataset.qtyset){S.qtyN=+t.dataset.qtyset;S.keepScroll=true;render();return;}
 if(t.dataset.freq){S.freq=t.dataset.freq;S.keepScroll=true;render();return;}
 if(t.dataset.sw&&t.dataset.sw.startsWith('off.')){const k=t.dataset.sw.slice(4);S.keepScroll=true;if(k==='limit')S.off.limit=S.off.limit?0:500;else S.off[k]=!S.off[k];if(k==='limit'&&!S.off.unit)S.off.unit='units';toast('Saved');render();return;}
 if(t.dataset.sw){const k=t.dataset.sw;S.keepScroll=true;
  if(k==='monthly'&&!S.monthly){S.sheet='recurConfirm';render();return;}
  if(k==='p2p'&&S.p2p){S.sheet='p2pConfirm';render();return;}
  if(k==='daily'){S.daily=!S.daily;toast(S.daily?'Daily giving is on':'Daily giving is off');render();return;}
  if(k==='autoThank'){S.autoThank=!S.autoThank;toast(S.autoThank?'Auto-thank is on':'Auto-thank is off');render();return;}
  if(k in S){S[k]=!S[k];toast('Saved');}render();return;}
 const a=t.dataset.act;
 if(a==='scrim'&&e.target!==t)return;
 S.keepScroll=true;
 switch(a){
  case 'leaderboards':toast('(Prototype) The platform-wide Ramadan leaderboards would open in a new tab.');render();break;
  case 'boostCsv':toast('(Prototype) Your boost payouts would download as a CSV.');render();break;
  case 'back':go(S.route.includes('/')?S.route.split('/')[0]:'home');break;
  case 'coach':S.sheet='coach';if(!S.chat.length)S.chat.push({w:'a',t:'Salam Soheb. I’m here to help your fundraiser grow. Ask me to change anything, or ask how it’s going.'});render();break;
  case 'coachPayout':S.sheet='coach';ask('Change my bank account');break;
  case 'statusSheet':S.sheet='status';render();break;
  case 'endSheet':S.sheet='endc';render();break;
  case 'endConfirm':S.sheet=null;toast('In the real app, the fundraiser would end now');render();break;
  case 'pauseSheet':S.sheet='pause';render();break;
  case 'pauseConfirm':{const u=(document.getElementById('p-until')||{}).value;S.pauseUntil=u?new Date(u+'T12:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}):'';S.paused=true;S.sheet=null;toast('Donations are paused');render();break;}
  case 'resume':S.paused=false;S.sheet=null;S.pauseUntil='';toast('Donations are back on, mashaAllah');render();break;
  case 'bankSheet':S.sheet='bank';S.bankSel=S.bank||'4821';render();break;
  case 'bankSave':if(S.bankSel===(S.bank||'4821')){S.sheet=null;render();break;}S.bank=S.bankSel;S.sheet=null;toast('Code sent to the account owner to confirm the change');render();break;
  case 'bankNew':toast(has('bankconnect')?'instant bank connection opens here to connect your bank':'Opens the bank details form');render();break;
  case 'scrim':case 'close':S.sheet=null;render();break;
  case 'send':{const v=(document.getElementById('coach-in')||{}).value;if(v&&v.trim())ask(v.trim());break;}
  case 'coachConfirm':{const p=S.pending;if(!p)break;p.apply();S.pending=null;S.chat=S.chat.filter(m=>!m.c);S.chat.push({w:'a',t:p.done+(p.link&&p.link!==S.route?` <button class="link" data-go="${p.link}">View ${TITLES[p.link]}</button>`:'')+' <button class="link" data-act="undo">Undo</button>'});S.undo=p;toast('Saved');render();break;}
  case 'coachCancel':S.pending=null;S.chat=S.chat.filter(m=>!m.c);S.chat.push({w:'a',t:'No problem. I haven’t changed anything.'});render();break;
  case 'undo':S.chat.push({w:'a',t:'(Prototype) The change would be reverted here.'});render();break;
  case 'ideas':S.sheet='ideas';render();break;
  case 'newF':if(!has('create')){toast('Today this opens the current creation form');render();break;}newCr();go('create');break;
  case 'resumeDraft':newCr();Object.assign(S.cr,{title:'Winter blankets for families in Gaza',img:'emergency',goal:25000,step:'story',done:{what:true,title:true,image:true,goal:true}});go('create');break;
  case 'crMyself':S.cr.myself=!S.cr.myself;if(S.cr.myself&&S.cr.step==='what'){S.cr.done.what=true;S.cr.skipWhat=true;S.cr.step='image';}toast(S.cr.myself?'Coach is off. You can turn her back on any time.':'Coach is back');render();break;
  case 'crWhat':S.cr.what=(document.getElementById('cr-what')||{}).value||S.cr.what;crNext();render();break;
  case 'crTitleUse':S.cr.title=TITLE_OPTS[S.cr.ti];crNext();render();break;
  case 'crTitleAgain':S.cr.ti=(S.cr.ti+1)%TITLE_OPTS.length;S.keepScroll=true;render();break;
  case 'crTitleOwn':S.cr.ownTitle=true;S.keepScroll=true;render();break;
  case 'crTitleSave':S.cr.title=(document.getElementById('cr-title')||{}).value||'My fundraiser';S.cr.ownTitle=false;crNext();render();break;
  case 'crGoalOk':crNext();render();break;
  case 'crQ':{const v=(document.getElementById('cr-q')||{}).value;if(v)S.cr.qs[S.cr.qi]=v;S.cr.qi++;if(S.cr.qi===3){S.cr.story=STORY();S.cr.storyCoach=true;}S.keepScroll=true;render();break;}
  case 'crStoryUse':crNext();render();break;
  case 'crStoryShort':S.cr.story=`<mark>${S.cr.qs[0]}</mark> are facing freezing nights. We’re sending <mark>${S.cr.qs[1].charAt(0).toLowerCase()+S.cr.qs[1].slice(1)}</mark>. Please give and share. JazakAllah khair.`;S.keepScroll=true;render();break;
  case 'crStoryEdit':S.cr.myselfStory=true;S.cr.myself=true;S.keepScroll=true;render();break;
  case 'crStoryOwn':{const v=(document.getElementById('cr-story')||{}).value;S.cr.story=v||S.cr.story||'Our story.';S.cr.storyCoach=false;if(S.cr.myselfStory){S.cr.myself=false;S.cr.myselfStory=false;}crNext();render();break;}
  case 'crOffUse':S.cr.offers=true;crNext();render();break;
  case 'crOffSkip':crNext();render();break;
  case 'crOffIdeas':toast('Opens the offering ideas, same as Page › Offerings');render();break;
  case 'crSubmit':S.cr.done.details=true;S.submitted=true;go('fundraisers');toast('Submitted, mashaAllah. We’ll review it within 24–48 hours.');break;
  case 'otherF':toast('In the real app, this opens that fundraiser\u2019s home');render();break;
  case 'thankAll':S.sheet='thankConfirm';render();break;
  case 'sendPerson':{const p=S.people[S.pIdx];if(p.st==='reach'){p.st='messaged';p.msgd='today';p.f='Salam, just a gentle reminder about the NICU fundraiser. We’re 62% of the way. example.org/babies500';toast('Sent. WhatsApp would open here.');}else if(p.st==='messaged'){toast('Follow-up sent');}else if(p.st==='tothank'){p.st='thanked';p.thk='today';toast('Thank-you sent');}S.sheet=null;render();break;}
  case 'confirmThanks':S.thankedAll=true;S.people.forEach(p=>{if(p.st==='tothank'){p.st='thanked';p.thk='today';}});S.sheet=null;toast('42 thank-yous sent');render();break;
  case 'addPeople':S.sheet='add';S.addSrc=null;S.addSel=[];S.addQ='';S.fileDone=false;render();break;
  case 'addBack':S.addSrc=null;S.addSel=[];S.addQ='';S.fileDone=false;render();break;
  case 'fakeUpload':S.fileDone=true;render();break;
  case 'addManual':{const n=(document.getElementById('m-n')||{}).value||'New contact';const r=(document.getElementById('m-r')||{}).value||'Added by you';S.people.unshift({n,r,st:'reach',m:draftFor(n,r)});S.sheet=null;S.sFilter='reach';toast(n+' added. Coach drafted a message.');render();break;}
  case 'addConfirm':{const src=SOURCES.find(x=>x.id===S.addSrc);const all=[].concat(...Object.values(CONTACTS),[['Zaid Haddad','From contacts.csv'],['Mona Aziz','From contacts.csv'],['Bashir Omar','From contacts.csv'],['Salma Idris','From contacts.csv'],['Yahya Noor','From contacts.csv']]);
   S.addSel.slice().reverse().forEach(n=>{const c=all.find(x=>x[0]===n)||[n,''];S.people.unshift({n,r:c[1]||src.n,st:'reach',m:draftFor(n,c[1])});});
   const k=S.addSel.length;S.sheet=null;S.sFilter='reach';S.route='supporters';toast(`${k} ${k===1?'person':'people'} added. Coach drafted a message for each.`);render();break;}
  case 'editMsg':toast('Edit the message in your own words');render();break;
  case 'addOpt':if(S.off.slots)break;S.edIdx=-1;S.ed={n:'New option',p:25,ask:{}};S.sheet='opt';render();break;
  case 'customQ':syncEd();toast('Custom questions: name the question and choose the answer type');render();break;
  case 'saveOpt':{syncEd();const x=S.ed;if(x.lim){if(x.left==null||x.left>x.lim)x.left=x.lim;}else{delete x.left;}if(S.edIdx<0)S.off.tiers.push(x);else S.off.tiers[S.edIdx]=x;S.sheet=null;toast('Option saved');render();break;}
  case 'backToTiers':S.off.slots=false;toast('Back to price options');render();break;
  case 'bankconnect':S.chat.push({w:'a',t:'(Prototype) The bank’s secure window would open here for you to sign in to your bank.'});render();break;
  case 'confirmRecur':S.monthly=true;S.sheet=null;toast('Monthly giving is on. End date removed.');render();break;
  case 'confirmP2p':S.p2p=false;S.sheet=null;toast('Peer-to-peer is off');render();break;
  case 'offline':S.sheet='offline';render();break;
  case 'saveOffline':{const n=(document.getElementById('o-name')||{}).value||'Offline donation';const amt=parseInt(((document.getElementById('o-amt')||{}).value||'0').replace(/\D/g,''))||0;S.dons.unshift({n,a:amt,t:'Just now',k:'Offline'});S.sheet=null;toast('Offline donation added');render();break;}
  case 'update':S.sheet='update';render();break;
  case 'postUpdate':S.updatePosted=true;S.updates.unshift({t:(document.getElementById('u-t')||{}).value||'New update',d:'Today',em:812,res:'too early to tell'});S.sheet=null;toast('Update posted and emailed to 812 donors');render();break;
  case 'newlink':S.sheet='newlink';render();break;
  case 'saveLink':{const n=(document.getElementById('l-name')||{}).value||'New link';const slug=n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');S.links.push({name:n,url:'example.org/l/'+slug,don:0,amt:0});S.sheet=null;toast('Link created and copied');render();break;}
  case 'golive':S.status='live';toast('Your fundraiser is live, mashaAllah');render();break;
 }});
document.addEventListener('scroll',e=>{if(e.target.id==='fscroll')updMore();},true);
window.addEventListener('resize',()=>updMore());
document.addEventListener('input',e=>{if(e.target.id==='r-start'){S.dailyStart=e.target.value;return;}if(e.target.id==='add-q'){S.addQ=e.target.value;render();const i=document.getElementById('add-q');if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);}}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='coach-in'){const v=e.target.value.trim();if(v)ask(v);}if(e.key==='Escape'&&S.sheet){S.sheet=null;render();}});
render();
</script>
