<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Fundraisers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --brand-50: #EDF7F0; --brand-500: #4AA567; --brand-600: #3C8653; --brand-700: #2C633D;
    --n0: #FFFFFF; --n50: #FAFAFA; --n100: #F5F5F5; --n200: #E5E5E5; --n300: #D4D4D4;
    --n400: #A3A3A3; --n500: #737373; --n600: #525252; --n700: #404040; --n900: #171717;
    --green-50: #F0FDF4; --green-700: #15803D;
    --blue-50: #EFF6FF; --blue-700: #1D4ED8;
    --indigo-50: #EEF2FF; --indigo-700: #4338CA;
    --purple-50: #FAF5FF; --purple-700: #7E22CE;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--n50); color: var(--n900); font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; -webkit-font-smoothing: antialiased; }
  button, select { font: inherit; }
  .icon { width: 20px; height: 20px; flex: none; }
  .icon-sm { width: 16px; height: 16px; flex: none; }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 24px; background: var(--n0); border-bottom: 1px solid var(--n200); }
  .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 20px; font-weight: 800; letter-spacing: -0.025em; }
  .brand-mark { width: 28px; height: 28px; border-radius: 9999px; background: var(--brand-500); display: inline-flex; align-items: center; justify-content: center; color: #fff; }
  .head-left { display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .head-right { display: flex; align-items: center; gap: 12px; }
  .field { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--n600); }
  .pill-select { font-weight: 600; color: var(--n900); padding: 8px 12px; min-height: 40px; border: 1px solid var(--n300); border-radius: 9999px; background: var(--n0); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 8px 18px; border-radius: 9999px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--n300); background: var(--n0); color: var(--n900); transition: background 150ms; }
  .btn:hover { background: var(--n100); }
  .btn-primary { background: var(--n900); border-color: var(--n900); color: #fff; }
  .btn-primary:hover { background: #262626; }
  .avatar { width: 32px; height: 32px; border-radius: 9999px; background: var(--n200); display: inline-flex; align-items: center; justify-content: center; color: var(--n500); flex: none; }
  .avatar-xs { width: 20px; height: 20px; }

  .layout { display: flex; flex-wrap: wrap; gap: 24px; max-width: 1280px; margin: 0 auto; padding: 24px 16px; }
  nav { flex: 1 1 200px; max-width: 240px; display: flex; flex-direction: column; gap: 4px; }
  .nav-btn { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 44px; padding: 10px 12px; font-size: 14px; font-weight: 600; text-align: left; border: 0; border-radius: 8px; cursor: pointer; background: transparent; color: var(--n700); }
  .nav-btn:hover { background: var(--n100); }
  .nav-btn[aria-current="page"] { background: var(--brand-50); color: var(--brand-700); }
  main { flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
  @media (max-width: 720px) { nav { max-width: none; flex-direction: row; overflow-x: auto; } .nav-btn { width: auto; white-space: nowrap; } }

  h1 { margin: 0; font-size: 30px; line-height: 36px; font-weight: 700; letter-spacing: -0.01em; }
  h2 { margin: 0; font-size: 18px; font-weight: 700; }
  .lede { margin: 6px 0 0; font-size: 16px; color: var(--n600); }

  .tabs { display: flex; gap: 24px; border-bottom: 1px solid var(--n200); overflow-x: auto; }
  .tab { display: inline-flex; align-items: center; gap: 8px; padding: 10px 0; min-height: 44px; border: 0; border-bottom: 2px solid transparent; background: none; font-size: 14px; font-weight: 600; color: var(--n600); cursor: pointer; white-space: nowrap; }
  .tab[aria-selected="true"] { color: var(--n900); border-bottom-color: var(--n900); }
  .count { font-size: 12px; padding: 1px 8px; border-radius: 9999px; background: var(--n100); color: var(--n700); }

  .filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .chip { min-height: 44px; padding: 8px 16px; border-radius: 9999px; font-size: 14px; font-weight: 600; cursor: pointer; border: 1px solid var(--n300); background: var(--n0); color: var(--n900); }
  .chip:hover { border-color: var(--n900); }
  .chip[aria-pressed="true"] { background: var(--n900); border-color: var(--n900); color: #fff; }
  .filters .field { margin-left: auto; }

  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 9999px; font-size: 12px; font-weight: 600; line-height: 20px; }
  .badge .dot { width: 6px; height: 6px; border-radius: 9999px; background: currentColor; }
  .b-green { background: var(--green-50); color: var(--green-700); }
  .b-neutral { background: var(--n100); color: var(--n700); }
  .b-indigo { background: var(--indigo-50); color: var(--indigo-700); }
  .b-purple { background: var(--purple-50); color: var(--purple-700); }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 20px; width: 100%; text-align: left; color: inherit; padding: 20px; background: var(--n0); border: 1px solid var(--n200); border-radius: 8px; cursor: pointer; transition: border-color 150ms; }
  .row:hover { border-color: var(--n400); }
  .row-main { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 10px; }
  .row-title { font-size: 18px; line-height: 26px; font-weight: 700; }
  .payee { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--n600); }
  .payee strong { color: var(--n900); font-weight: 600; }
  .row-stats { flex: 1 1 240px; display: flex; flex-direction: column; gap: 8px; }
  .row-stats-top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; }
  .muted { color: var(--n600); }
  .bar { height: 6px; border-radius: 9999px; background: var(--n200); overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--brand-500); border-radius: 9999px; }
  .chev { color: var(--n500); }
  .empty { padding: 40px 20px; text-align: center; background: var(--n0); border: 1px dashed var(--n300); border-radius: 8px; color: var(--n600); }

  .back { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; color: var(--n900); background: none; border: 0; padding: 8px 0; min-height: 44px; cursor: pointer; }
  .banner { display: flex; gap: 12px; padding: 16px; border-radius: 8px; background: var(--blue-50); color: var(--blue-700); }
  .banner-title { font-weight: 700; font-size: 14px; }
  .banner-body { font-size: 14px; line-height: 20px; color: var(--n700); margin-top: 2px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; }
  .stat { padding: 16px; background: var(--n0); border: 1px solid var(--n200); border-radius: 8px; }
  .stat-label { font-size: 14px; color: var(--n600); }
  .stat-value { font-size: 24px; font-weight: 700; margin-top: 4px; }
  .stat-value.small { font-size: 16px; margin-top: 8px; }
  .card { padding: 20px; background: var(--n0); border: 1px solid var(--n200); border-radius: 8px; display: flex; flex-direction: column; gap: 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .locked { display: flex; align-items: flex-start; gap: 12px; padding: 16px; background: var(--n100); border-radius: 8px; color: var(--n700); font-size: 14px; line-height: 20px; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 12px 0; border-top: 1px solid var(--n200); font-size: 14px; }
  .line strong { font-weight: 600; }

  .scenario { max-width: 1280px; margin: 0 auto 32px; padding: 0 16px; }
  .scenario-box { display: flex; flex-wrap: wrap; align-items: center; gap: 16px 24px; padding: 14px 16px; border: 1px dashed var(--n300); border-radius: 8px; font-size: 14px; color: var(--n600); background: var(--n0); }
  .scenario-box strong { color: var(--n900); }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; min-height: 44px; }
  .toggle input { width: 18px; height: 18px; accent-color: var(--brand-600); }
</style>
</head>
<body>
<header>
  <div class="head-left">
    <span class="brand"><span class="brand-mark" aria-hidden="true"><svg class="icon-sm" viewBox="0 0 24 24" fill="currentColor"><path d="M11.645 20.91l-.007-.003-.022-.012a15.247 15.247 0 01-.383-.218 25.18 25.18 0 01-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0112 5.052 5.5 5.5 0 0116.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 01-4.244 3.17 15.247 15.247 0 01-.383.219l-.022.012-.007.004-.003.001a.752.752 0 01-.704 0l-.003-.001z"/></svg></span>LaunchGood</span>
    <label class="field" id="orgSelector">Organization
      <select class="pill-select" aria-label="Organization">
        <option>Amina Rahman (personal)</option>
        <option>Bright Futures Collective</option>
      </select>
    </label>
  </div>
  <div class="head-right">
    <button type="button" class="btn">Start a fundraiser</button>
    <span class="avatar" role="img" aria-label="Amina Rahman"><svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/></svg></span>
  </div>
</header>

<div class="layout">
  <nav aria-label="Dashboard" id="nav"></nav>
  <main id="main"></main>
</div>

<div class="scenario">
  <div class="scenario-box">
    <strong>Prototype scenario</strong>
    <label class="toggle"><input type="checkbox" id="ownAccount" checked> User has their own payout account</label>
    <label class="toggle"><input type="checkbox" id="orgToggle" checked> Show organization selector (phase 2)</label>
    <span>All names and amounts are sample data.</span>
  </div>
</div>

<script>
(() => {
  const ICONS = {
    grid: 'M3.75 6A2.25 2.25 0 016 3.75h2.25A2.25 2.25 0 0110.5 6v2.25a2.25 2.25 0 01-2.25 2.25H6a2.25 2.25 0 01-2.25-2.25V6zM3.75 15.75A2.25 2.25 0 016 13.5h2.25a2.25 2.25 0 012.25 2.25V18a2.25 2.25 0 01-2.25 2.25H6A2.25 2.25 0 013.75 18v-2.25zM13.5 6a2.25 2.25 0 012.25-2.25H18A2.25 2.25 0 0120.25 6v2.25A2.25 2.25 0 0118 10.5h-2.25a2.25 2.25 0 01-2.25-2.25V6zM13.5 15.75a2.25 2.25 0 012.25-2.25H18a2.25 2.25 0 012.25 2.25V18A2.25 2.25 0 0118 20.25h-2.25A2.25 2.25 0 0113.5 18v-2.25z',
    banknotes: 'M2.25 18.75a60.07 60.07 0 0115.797 2.101c.727.198 1.453-.342 1.453-1.096V18.75M3.75 4.5v.75A.75.75 0 013 6h-.75m0 0v-.375c0-.621.504-1.125 1.125-1.125H20.25M2.25 6v9m18-10.5v.75c0 .414.336.75.75.75h.75m-1.5-1.5h.375c.621 0 1.125.504 1.125 1.125v9.75c0 .621-.504 1.125-1.125 1.125h-.375m1.5-1.5H21a.75.75 0 00-.75.75v.75m0 0H3.75m0 0h-.375a1.125 1.125 0 01-1.125-1.125V15m1.5 1.5v-.75A.75.75 0 003 15h-.75M15 10.5a3 3 0 11-6 0 3 3 0 016 0zm3 0h.008v.008H18V10.5zm-12 0h.008v.008H6V10.5z',
    users: 'M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z',
    chart: 'M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 013 19.875v-6.75zM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V8.625zM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 01-1.125-1.125V4.125z',
    chevronRight: 'M8.25 4.5l7.5 7.5-7.5 7.5',
    arrowLeft: 'M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18',
    lock: 'M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z',
    info: 'M11.25 11.25l.041-.02a.75.75 0 011.063.852l-.708 2.836a.75.75 0 001.063.853l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z',
    user: 'M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z'
  };
  const icon = (name, cls = 'icon') =>
    `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="${ICONS[name]}"/></svg>`;
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const money = (n) => '$' + n.toLocaleString('en-US');

  const PAYEES = {
    you: 'You (Amina Rahman)',
    hope: 'Hope Relief Foundation',
    water: 'Water for All Trust',
    masjid: 'Al-Noor Community Masjid'
  };
  const STATUS = { live: ['Live', 'b-green'], draft: ['Draft', 'b-neutral'], closed: ['Closed', 'b-neutral'] };
  const ROLE = { creator: ['Creator', 'b-indigo'], team: ['Team member', 'b-purple'] };
  const ALL = [
    { id: 1, title: 'Winter warmth for refugee families', role: 'creator', payee: 'hope', status: 'live', raised: 8420, goal: 10000, donations: 96 },
    { id: 2, title: 'Ramadan iftar drive for our neighborhood', role: 'creator', payee: 'you', status: 'live', raised: 2150, goal: 5000, donations: 41 },
    { id: 3, title: 'Clean water wells for village families', role: 'team', payee: 'water', status: 'live', raised: 31600, goal: 50000, donations: 512 },
    { id: 4, title: 'Masjid roof repair before winter', role: 'team', payee: 'masjid', status: 'closed', raised: 45000, goal: 40000, donations: 820 },
    { id: 5, title: 'Back-to-school kits for orphans', role: 'creator', payee: 'you', status: 'draft', raised: 0, goal: 3000, donations: 0 }
  ];
  const MONEY = {
    payouts: { title: 'Payouts', body: 'Sample payouts for this account.', rows: [['Available to pay out', '$1,240.00'], ['Last payout, Oct 15', '$910.00']] },
    donors: { title: 'Donors', body: 'Donors to fundraisers that pay out to this account.', rows: [['Donors this month', '38'], ['Returning donors', '12']] },
    reports: { title: 'Reports', body: 'Reports for this account, unchanged from today.', rows: [['Financial summary', 'Download'], ['Gift Aid', 'Download']] }
  };

  const state = { view: 'list', status: 'all', role: 'all', payee: 'all', selectedId: null, ownAccount: true };
  const set = (patch) => { Object.assign(state, patch); render(); };

  const fundraisers = () => state.ownAccount ? ALL : ALL.filter((f) => f.payee !== 'you');
  const badges = (f) =>
    `<div class="badges"><span class="badge ${STATUS[f.status][1]}"><span class="dot"></span>${STATUS[f.status][0]}</span><span class="badge ${ROLE[f.role][1]}">${ROLE[f.role][0]}</span></div>`;
  const donationsLabel = (n) => n === 1 ? '1 donation' : `${n} donations`;

  function renderNav() {
    const items = [['list', 'My fundraisers', 'grid'], ['payouts', 'Payouts', 'banknotes'], ['donors', 'Donors', 'users'], ['reports', 'Reports', 'chart']];
    const active = state.view === 'detail' ? 'list' : state.view;
    document.getElementById('nav').innerHTML = items.map(([id, label, ic]) =>
      `<button type="button" class="nav-btn" data-go="${id}"${active === id ? ' aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`
    ).join('');
  }

  function renderList() {
    const base = fundraisers();
    const payeeKeys = [...new Set(base.map((f) => f.payee))];
    if (state.payee !== 'all' && !payeeKeys.includes(state.payee)) state.payee = 'all';
    const scoped = base.filter((f) => (state.role === 'all' || f.role === state.role) && (state.payee === 'all' || f.payee === state.payee));
    const count = (s) => scoped.filter((f) => s === 'all' || f.status === s).length;
    const rows = scoped.filter((f) => state.status === 'all' || f.status === state.status);

    const tabs = [['all', 'All'], ['live', 'Live'], ['draft', 'Draft'], ['closed', 'Closed']].map(([id, label]) =>
      `<button type="button" role="tab" class="tab" data-status="${id}" aria-selected="${state.status === id}">${label}<span class="count">${count(id)}</span></button>`).join('');
    const chips = [['all', 'All roles'], ['creator', 'Created by you'], ['team', 'Team member']].map(([id, label]) =>
      `<button type="button" class="chip" data-role="${id}" aria-pressed="${state.role === id}">${label}</button>`).join('');
    const options = [['all', 'Anyone'], ...payeeKeys.map((k) => [k, PAYEES[k]])].map(([v, l]) =>
      `<option value="${v}"${state.payee === v ? ' selected' : ''}>${esc(l)}</option>`).join('');

    const list = rows.length ? rows.map((f) => {
      const pct = Math.min(100, Math.round((f.raised / f.goal) * 100));
      return `<button type="button" class="row" data-open="${f.id}">
        <div class="row-main">
          ${badges(f)}
          <span class="row-title">${esc(f.title)}</span>
          <span class="payee"><span class="avatar avatar-xs">${icon('user', 'icon-sm')}</span>Pays out to <strong>${esc(PAYEES[f.payee])}</strong></span>
        </div>
        <div class="row-stats">
          <div class="row-stats-top"><span><strong style="font-size:16px">${money(f.raised)}</strong> <span class="muted">of ${money(f.goal)}</span></span><span class="muted">${donationsLabel(f.donations)}</span></div>
          <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100" aria-label="${pct}% of goal"><span style="width:${pct}%"></span></div>
        </div>
        <span class="chev">${icon('chevronRight')}</span>
      </button>`;
    }).join('') : `<div class="empty">No fundraisers match these filters.</div>`;

    return `
      <div>
        <h1>My fundraisers</h1>
        <p class="lede">Every fundraiser you created or help run, wherever the donations go.</p>
      </div>
      <div class="tabs" role="tablist" aria-label="Status">${tabs}</div>
      <div class="filters">
        ${chips}
        <label class="field">Pays out to <select class="pill-select" id="payeeSelect">${options}</select></label>
      </div>
      <div class="list">${list}</div>`;
  }

  function renderDetail() {
    const base = fundraisers();
    const f = base.find((x) => x.id === state.selectedId) || base[0];
    const other = f.payee !== 'you';
    const name = esc(PAYEES[f.payee]);
    const banner = other ? `
      <div class="banner" role="note">${icon('info')}<div>
        <div class="banner-title">Donations go to ${name}</div>
        <div class="banner-body">Payouts and donor details are managed by ${name}. You can still edit the story, post updates, manage your team and share this fundraiser.</div>
      </div></div>` : '';
    const donors = other
      ? `<div class="locked">${icon('lock')}<span>Donor names and contact details are shared with ${name}, who receives the donations. You can thank donors through updates on the fundraiser page.</span></div>`
      : [['Yusuf K.', '$100 · 2 days ago'], ['Anonymous', '$25 · 3 days ago'], ['Sara M.', '$50 · 1 week ago']]
          .map(([n, v]) => `<div class="line"><strong>${n}</strong><span class="muted">${v}</span></div>`).join('');
    return `
      <button type="button" class="back" data-go="list">${icon('arrowLeft', 'icon-sm')}My fundraisers</button>
      <div style="display:flex;flex-direction:column;gap:10px">${badges(f)}<h1>${esc(f.title)}</h1></div>
      ${banner}
      <div class="stats">
        <div class="stat"><div class="stat-label">Raised</div><div class="stat-value">${money(f.raised)}</div></div>
        <div class="stat"><div class="stat-label">Goal</div><div class="stat-value">${money(f.goal)}</div></div>
        <div class="stat"><div class="stat-label">Donations</div><div class="stat-value">${f.donations}</div></div>
        <div class="stat"><div class="stat-label">Pays out to</div><div class="stat-value small">${name}</div></div>
      </div>
      <section class="card"><h2>Manage</h2><div class="actions">
        <button type="button" class="btn">Edit story</button>
        <button type="button" class="btn">Post an update</button>
        <button type="button" class="btn">Manage team</button>
        <button type="button" class="btn">Share</button>
      </div></section>
      <section class="card"><h2>Donors</h2>${donors}</section>`;
  }

  function renderMoney() {
    const m = MONEY[state.view];
    const picker = state.ownAccount
      ? `<label class="field">Payout account <select class="pill-select"><option>Amina Rahman · USD</option></select></label>` : '';
    const body = state.ownAccount
      ? `<div class="card"><span class="muted" style="font-size:14px">${m.body}</span>${m.rows.map(([l, v]) => `<div class="line"><strong>${l}</strong><span class="muted">${v}</span></div>`).join('')}</div>`
      : `<div class="card" style="align-items:flex-start;padding:32px 24px">
          <h2>You don't have a payout account yet</h2>
          <p class="muted" style="margin:0;font-size:14px;line-height:20px;max-width:560px">The fundraisers you run for other organizations are paid out by them, so their payouts, donors and reports stay with them. You can still find and manage every one of your fundraisers under My fundraisers.</p>
          <div class="actions"><button type="button" class="btn btn-primary" data-go="list">Go to My fundraisers</button><button type="button" class="btn">Set up a payout account</button></div>
        </div>`;
    return `
      <div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px">
        <div><h1>${m.title}</h1><p class="lede">Shown per payout account. Only accounts you own or have access to appear here.</p></div>
        ${picker}
      </div>
      ${body}`;
  }

  function render() {
    renderNav();
    const main = document.getElementById('main');
    main.innerHTML = state.view === 'list' ? renderList() : state.view === 'detail' ? renderDetail() : renderMoney();
    const payeeSelect = document.getElementById('payeeSelect');
    if (payeeSelect) payeeSelect.addEventListener('change', (e) => set({ payee: e.target.value }));
  }

  document.addEventListener('click', (e) => {
    const t = e.target.closest('[data-go],[data-status],[data-role],[data-open]');
    if (!t) return;
    if (t.dataset.go) set({ view: t.dataset.go });
    else if (t.dataset.status) set({ status: t.dataset.status });
    else if (t.dataset.role) set({ role: t.dataset.role });
    else if (t.dataset.open) { set({ view: 'detail', selectedId: Number(t.dataset.open) }); window.scrollTo(0, 0); }
  });
  document.getElementById('ownAccount').addEventListener('change', (e) => set({ ownAccount: e.target.checked }));
  document.getElementById('orgToggle').addEventListener('change', (e) => {
    document.getElementById('orgSelector').style.display = e.target.checked ? '' : 'none';
  });

  render();
})();
</script>
</body>
</html>
